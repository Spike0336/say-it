<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What are they playing?</title>
<style>
:root{--bg1:#bfe9ff;--bg2:#fff3c4;--card:#fff;--ink:#27304a;--accent:#ff7043;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1d2b4a;--bg2:#3a2f55;--card:#2b3350;--ink:#f3f4ff}}
:root[data-theme="dark"]{--bg1:#1d2b4a;--bg2:#3a2f55;--card:#2b3350;--ink:#f3f4ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);font-family:"Baloo 2","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px;overflow-x:hidden}
h1{margin:6px 0 2px;font-size:clamp(26px,7vw,40px);text-align:center}
#stars{font-size:22px;min-height:30px}
.card{background:var(--card);border-radius:28px;padding:10px;width:100%;max-width:520px;box-shadow:0 8px 24px #0003}
svg{width:100%;height:auto;display:block;border-radius:20px}
#start{text-align:center;padding:22px 12px}
#start p{font-size:20px;margin:8px 0 18px}
button{font:inherit;border:0;border-radius:40px;cursor:pointer;color:#fff;background:var(--accent);padding:12px 26px;font-size:22px;font-weight:700;box-shadow:0 4px 0 #0003}
button:active{transform:translateY(3px);box-shadow:none}
button.big{font-size:34px;padding:18px 44px}
button.sm{background:#5c6bc0;font-size:20px;padding:8px 18px}
#bar{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:10px;flex-wrap:wrap}
#mic{font-size:20px;font-weight:700;padding:8px 16px;border-radius:30px;background:#e8f5e9;color:#1b5e20}
#mic.on{animation:pulse 1.1s infinite}
@keyframes pulse{50%{transform:scale(1.08);background:#c8e6c9}}
#msg{font-size:clamp(24px,7vw,38px);font-weight:800;text-align:center;min-height:50px;margin:10px 0 0;color:var(--accent)}
#choices{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.hide{display:none!important}
.conf{position:fixed;top:-40px;font-size:30px;pointer-events:none;animation:fall linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
</style></head>
<body>
<h1>🏅 What are they playing? 🏅</h1>
<div id="stars"></div>
<div class="card" id="start">
  <p>Look at the picture and say the sport out loud!</p>
  <button class="big" id="go">▶ Play!</button>
  <p id="note" style="font-size:15px;margin-top:16px"></p>
</div>
<div class="card hide" id="game">
  <div id="pic"></div>
  <div id="msg"></div>
  <div id="bar">
    <span id="mic">🎤 Listening…</span>
    <button class="sm" id="again">🔊 Again</button>
    <button class="sm" id="skip">⏭ Next</button>
  </div>
  <div id="choices" class="hide"></div>
</div>

const $=id=>document.getElementById(id);
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let bag=[],cur=null,last=-1,locked=true,rec=null,active=false,stars=0,misses=0,tmr=null,ac=null,voice=null;
function pickVoice(){const v=speechSynthesis.getVoices();voice=v.find(x=>/en[-_]GB/i.test(x.lang)&&/female|google|samantha|serena|kate/i.test(x.name))||v.find(x=>/^en/i.test(x.lang))||null}
try{speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}catch(e){}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.9;u.pitch=1.15;if(voice)u.voice=voice;speechSynthesis.speak(u)}catch(e){}}
function fanfare(){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  [[523,0,.14],[659,.15,.14],[784,.3,.14],[1047,.45,.45],[784,.95,.12],[1047,1.08,.8]].forEach(([f,t,d])=>{
    const o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.value=f;o.connect(g);g.connect(ac.destination);
    const s=ac.currentTime+t;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.22,s+.03);g.gain.exponentialRampToValueAtTime(.0001,s+d+.1);o.start(s);o.stop(s+d+.15)});}catch(e){}
}
function confetti(){
  const em=['🎉','⭐','🏅','✨','🎊','🌟'];
  for(let i=0;i<36;i++){const d=document.createElement('div');d.className='conf';d.textContent=em[i%em.length];
    d.style.left=Math.random()*100+'vw';d.style.animationDuration=(2+Math.random()*2)+'s';d.style.animationDelay=Math.random()*.6+'s';
    document.body.appendChild(d);setTimeout(()=>d.remove(),5000)}
}
function stopRec(){active=false;try{rec&&(rec.onend=null,rec.abort())}catch(e){}rec=null;$('mic').classList.remove('on')}
function listen(){
  if(!SR)return;stopRec();
  rec=new SR();rec.lang='en-GB';rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=3;active=true;
  rec.onresult=e=>{
    if(locked)return;
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i];let t='';
      for(let j=0;j<r.length;j++)t+=' '+r[j].transcript.toLowerCase();
      if(cur.k.some(w=>t.includes(w))){win();return}
      if(r.isFinal&&t.trim())wrong();
    }};
  rec.onend=()=>{if(active&&!locked)setTimeout(()=>{try{rec.start()}catch(e){}},150)};
  rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){$('mic').textContent='🎤 Mic is off';active=false;showChoices()}};
  try{rec.start();$('mic').classList.add('on');$('mic').textContent='🎤 Listening…'}catch(e){}
}
function showChoices(){
  const c=$('choices');c.classList.remove('hide');c.innerHTML='';
  SP.map(s=>s).sort(()=>Math.random()-.5).slice(0,4).concat([]).forEach(()=>{});
  let opts=[cur];while(opts.length<4){const s=SP[Math.floor(Math.random()*SP.length)];if(!opts.includes(s))opts.push(s)}
  opts.sort(()=>Math.random()-.5).forEach(s=>{const b=document.createElement('button');b.className='sm';b.textContent=s.e+' '+s.n;b.onclick=()=>s===cur?win():wrong();c.appendChild(b)});
}
function wrong(){
  if(locked)return;misses++;clearTimeout(tmr);
  if(misses>=3){$('msg').textContent='It\'s '+cur.n+'! '+cur.e;say('It\'s '+cur.n+'! Can you say '+cur.n+'?')}
  else{$('msg').textContent='Have another go! 🤔';say('Nearly! Have another go!')}
  arm();
}
function arm(){clearTimeout(tmr);tmr=setTimeout(()=>{if(!locked){misses++;say('What sport are they playing?')}},14000)}
function win(){
  if(locked)return;locked=true;clearTimeout(tmr);stopRec();
  stars++;$('stars').textContent='⭐'.repeat(Math.min(stars,15))+(stars>15?' ×'+stars:'');
  $('msg').textContent='🎉 '+cur.n+'! '+cur.e;
  try{speechSynthesis.cancel()}catch(e){}
  fanfare();confetti();
  setTimeout(()=>say('Well done! It\'s '+cur.n+'!'),1700);
  setTimeout(next,5200);
}
function next(){
  clearTimeout(tmr);stopRec();
  if(!bag.length){bag=SP.map((_,j)=>j).sort(()=>Math.random()-.5);if(bag[0]===last)bag.push(bag.shift())}const i=bag.shift();last=i;cur=SP[i];
  $('pic').innerHTML=`<svg viewBox="0 0 400 300" role="img" aria-label="People playing a sport">${cur.s()}</svg>`;
  $('msg').textContent='';misses=0;locked=false;$('choices').classList.add('hide');
  listen();say('What sport are they playing?');arm();
  if(!SR)showChoices();
}
$('go').onclick=()=>{
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}
  $('start').classList.add('hide');$('game').classList.remove('hide');next();
};
$('again').onclick=()=>{if(!locked)say('What sport are they playing?')};
$('skip').onclick=()=>{if(!locked||true)next()};
if(!SR){$('note').textContent='This browser can\'t hear the microphone, so you\'ll tap the answer instead. For voice, open in Chrome or Safari.';$('mic').classList.add('hide')}
else $('note').textContent='Tap Play, then allow the microphone when asked.';
</script>
</body></html>
