<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What is in the bubble?</title>
<style>
:root{box-sizing:border-box;--sky1:#8fd3ff;--sky2:#e6f7ff;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--sky1:#2b5c8a;--sky2:#5a9bd0}}
:root[data-theme="dark"]{--sky1:#2b5c8a;--sky2:#5a9bd0}
html,body{height:100%;margin:0;overflow:hidden;background:linear-gradient(var(--sky1),var(--sky2));font-family:system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#stage{position:fixed;inset:0;overflow:hidden}
.cloud{position:absolute;font-size:90px;opacity:.85;animation:drift 60s linear infinite}
@keyframes drift{from{transform:translateX(-150px)}to{transform:translateX(110vw)}}
#bubble{position:absolute;top:-260px;width:min(46vw,230px);aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;
 background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.95) 0 8%,rgba(255,255,255,.35) 18%,rgba(180,225,255,.35) 60%,rgba(120,190,255,.55) 100%);
 border:3px solid rgba(255,255,255,.85);box-shadow:inset 0 0 25px rgba(255,255,255,.7),0 6px 20px rgba(0,60,120,.25);cursor:pointer}
#bubble span{font-size:min(24vw,125px);line-height:1;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(4deg)}}
#bubble.fall{animation:fall var(--fall,24s) linear forwards}
@keyframes fall{from{top:-260px}to{top:calc(100dvh - 40px)}}
#bubble.pop{animation:pop .35s ease-out forwards}
@keyframes pop{to{transform:scale(1.6);opacity:0}}
#bubble.wobble{animation-name:fall,wob;animation-duration:24s,.5s;animation-timing-function:linear,ease;animation-fill-mode:forwards,none}
@keyframes wob{25%{margin-left:-14px}75%{margin-left:14px}}
#mic{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:76px;height:76px;border-radius:50%;border:0;background:#fff;font-size:38px;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:5}
#mic.on{background:#ff6b8b;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
#start{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:linear-gradient(var(--sky1),var(--sky2))}
#start .big{font-size:min(30vw,170px)}
#go{width:min(40vw,190px);aspect-ratio:1;border-radius:50%;border:0;background:#3ec46d;color:#fff;font-size:min(20vw,95px);box-shadow:0 8px 0 #2a9a52,0 12px 24px rgba(0,0,0,.3);animation:pulse 1.6s infinite}
canvas{position:fixed;inset:0;pointer-events:none;z-index:8}
#gear{position:fixed;left:10px;top:calc(10px + env(safe-area-inset-top,0px));width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.5);font-size:24px;opacity:.45;z-index:20;touch-action:none}
#panel{display:none;position:fixed;inset:0;z-index:30;background:rgba(0,40,80,.55);align-items:center;justify-content:center}
#panel .card{background:#fff;color:#222;border-radius:24px;padding:24px 20px;width:min(88vw,420px);display:flex;flex-direction:column;align-items:center;gap:18px}
#panel .row{display:flex;align-items:center;gap:12px;width:100%;font-size:40px}
#speed{flex:1;height:34px;accent-color:#3ec46d}
#shut{display:none}
#score{position:fixed;left:10px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:30px;background:rgba(255,255,255,.88);color:#222;font-size:26px;z-index:20;box-shadow:0 3px 10px rgba(0,0,0,.25)}
#score b{font-size:28px;min-width:1ch;margin-right:8px}
#rs{border:0;background:none;font-size:22px;padding:0 0 0 4px;opacity:.6}
#speedbar{position:fixed;left:10px;top:calc(10px + env(safe-area-inset-top,0px));width:min(62vw,300px);display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:32px;background:rgba(255,255,255,.8);box-shadow:0 3px 10px rgba(0,0,0,.25);font-size:30px;z-index:20}
#speedbar input{flex:1;min-width:0;height:34px;margin:0;accent-color:#3ec46d;touch-action:pan-y}
</style>
</head>
<body>
<div id="stage">
 <div class="cloud" style="top:8%;animation-delay:-10s">☁️</div>
 <div class="cloud" style="top:35%;animation-delay:-35s;font-size:70px">☁️</div>
 <div class="cloud" style="top:62%;animation-delay:-50s">☁️</div>
 <div id="bubble"><span></span></div>
</div>
<button id="mic" aria-label="microphone">🎤</button>
<canvas id="cv"></canvas>
<div id="speedbar"><span>🐢</span><input id="speed" type="range" min="0" max="10" step="1" value="2" aria-label="bubble speed"><span>🐇</span></div>
<div id="score"><span>✅</span><b id="ok">0</b><span>❌</span><b id="no">0</b><button id="rs" aria-label="reset scores">🔄</button></div>
<div id="start"><div class="big">🫧🧚‍♀️🫧</div><button id="go" aria-label="play">▶</button></div>

<script>
const RAW=`🐶 dog|doggy|puppy
🐱 cat|kitty|kitten
🐭 mouse
🐹 hamster
🐰 rabbit|bunny
🦊 fox
🐻 bear
🐼 panda
🐨 koala
🐯 tiger
🦁 lion
🐮 cow
🐷 pig
🐸 frog
🐵 monkey
🐔 chicken|hen
🐧 penguin
🐦 bird
🦆 duck
🦉 owl
🐴 horse
🦄 unicorn
🐝 bee
🦋 butterfly
🐌 snail
🐞 ladybird|ladybug
🐢 turtle|tortoise
🐍 snake
🐙 octopus
🐠 fish
🐬 dolphin
🐳 whale
🦈 shark
🐘 elephant
🦒 giraffe
🦓 zebra
🐑 sheep|lamb
🐐 goat
🦀 crab
🐊 crocodile
🦔 hedgehog
🐿️ squirrel
🦇 bat
🐜 ant
🕷️ spider
🦢 swan
🦜 parrot
🦘 kangaroo
🐫 camel
🍎 apple
🍌 banana
🍓 strawberry
🍊 orange
🍇 grapes
🍉 watermelon
🍒 cherries|cherry
🍍 pineapple
🍐 pear
🍋 lemon
🥕 carrot
🍅 tomato
🌽 corn
🥦 broccoli
🥔 potato
🍄 mushroom
🍞 bread
🧀 cheese
🥚 egg
🍕 pizza
🍔 burger|hamburger
🍟 chips|fries
🍦 ice cream
🍪 biscuit|cookie
🎂 cake|birthday cake
🍩 doughnut|donut
🍫 chocolate
🍿 popcorn
⚽ football|ball
🚗 car
🚌 bus
🚂 train
✈️ aeroplane|plane|airplane
🚁 helicopter
🚲 bicycle|bike
🚢 boat|ship
🚀 rocket
🚜 tractor
🚒 fire engine|fire truck
🚑 ambulance
⏰ clock
🎈 balloon
🎁 present|gift
👑 crown
🎸 guitar
🥁 drum
🎹 piano
☂️ umbrella
🔑 key
📖 book
✏️ pencil
🧸 teddy|teddy bear
🪁 kite
🛏️ bed
🪑 chair
🏠 house|home
🌳 tree
🌻 flower|sunflower
⭐ star
🌙 moon
☀️ sun
☁️ cloud
🌈 rainbow
⛄ snowman
🔔 bell
👟 shoe|trainer
🧦 sock
🎩 hat
👓 glasses
🦷 tooth
👁️ eye
👃 nose
👂 ear
✋ hand
👶 baby
👧 girl
👦 boy
👩 woman|lady|mummy|mum
👨 man|daddy|dad
👵 grandma|granny|nanny
👴 grandad|grandpa
👸 princess
🤴 prince
🧙 wizard
🧚 fairy
🎅 father christmas|santa
👮 policeman|police|police officer
🧑‍🚒 fireman|firefighter
🧑‍🍳 chef|cook
🧑‍⚕️ doctor
🧑‍🚀 astronaut
🤖 robot
🧜 mermaid
🤡 clown
🦸 superhero`;
const ITEMS=RAW.split('\n').map(l=>{const i=l.indexOf(' ');const f=l.slice(i+1).split('|');return{e:l.slice(0,i),n:f[0],f}});
const $=id=>document.getElementById(id);
/* grammar: a / an / the / plural / uncountable */
const PL=['grapes','cherries','chips','glasses'],UN=['bread','cheese','chocolate','popcorn'],THE=['sun','moon'],NOT_AN=['unicorn'];
function is(it){const n=it.n;
 if(PL.includes(n))return "they're "+n;
 if(UN.includes(n)||n==='father christmas')return "it's "+n;
 if(THE.includes(n))return "it's the "+n;
 return "it's "+(/^[aeiou]/.test(n)&&!NOT_AN.includes(n)?"an ":"a ")+n}
const cap=s=>s[0].toUpperCase()+s.slice(1);
const bubble=$('bubble'),face=bubble.querySelector('span'),mic=$('mic'),cv=$('cv'),cx=cv.getContext('2d');
let ignoreUntil=0,handled=-1,noMic=false,playing=false,busy=false,speaking=false,cur=null,wrong=0,bag=[],timers=[],voice=null,rec=null,recOn=false;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

/* ---------- narrator ---------- */
function pickVoice(){
 const vs=speechSynthesis.getVoices().filter(v=>/en[-_]GB/i.test(v.lang));
 const bad=/male(?!.*female)|daniel|george|arthur|oliver|thomas|ryan/i;
 const pref=/female|serena|kate|libby|sonia|hazel|susan|martha|stephanie|fiona|amy|emma/i;
 voice=vs.find(v=>pref.test(v.name)&&!/^(?!.*female).*male/i.test(v.name))||vs.find(v=>!bad.test(v.name))||vs[0]||null;
}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(t){return new Promise(res=>{
 if(!('speechSynthesis' in window)){res();return}
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';if(voice)u.voice=voice;u.rate=.88;u.pitch=1.15;
 speaking=true;let d=false;const end=()=>{if(d)return;d=true;speaking=false;ignoreUntil=Date.now()+700;res()};
 u.onend=end;u.onerror=end;setTimeout(end,9000);speechSynthesis.speak(u)})}

/* ---------- sounds ---------- */
let ac;
function A(){if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}
function noise(dur,freq,q,vol,type='bandpass',when=0){
 const a=A(),n=a.sampleRate*dur,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
 for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
 const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;
 const g=a.createGain();const t=a.currentTime+when;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+Math.min(.02,dur/8));g.gain.exponentialRampToValueAtTime(.001,t+dur);
 s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+dur)}
function popSound(){const a=A(),t=a.currentTime;
 noise(.05,1800,.7,.9,'highpass');
 noise(.14,650,3,.55,'bandpass');
 const o=a.createOscillator(),g=a.createGain();o.type='triangle';
 o.frequency.setValueAtTime(1400,t);o.frequency.exponentialRampToValueAtTime(260,t+.07);
 g.gain.setValueAtTime(.45,t);g.gain.exponentialRampToValueAtTime(.001,t+.09);
 o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+.1)}
function popSoundOld(){const a=A(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
 o.frequency.setValueAtTime(900,t);o.frequency.exponentialRampToValueAtTime(180,t+.12);
 g.gain.setValueAtTime(.6,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+.16);
 noise(.08,2500,1,.5,'highpass')}
function fanfare(){const a=A(),t0=a.currentTime;
 [[523,0,.18],[659,.18,.18],[784,.36,.18],[1047,.54,.7]].forEach(([f,s,d])=>{
  [0,3].forEach(det=>{const o=a.createOscillator(),g=a.createGain();o.type='sawtooth';o.frequency.value=f;o.detune.value=det*4;
   const fl=a.createBiquadFilter();fl.type='lowpass';fl.frequency.value=2200;
   g.gain.setValueAtTime(0,t0+s);g.gain.linearRampToValueAtTime(.12,t0+s+.03);g.gain.setValueAtTime(.12,t0+s+d*.8);g.gain.exponentialRampToValueAtTime(.001,t0+s+d+.15);
   o.connect(fl);fl.connect(g);g.connect(a.destination);o.start(t0+s);o.stop(t0+s+d+.2)})})}
function cheer(){ /* applause: lots of individual hand claps, swelling then fading */
 for(let i=0;i<130;i++){
  const w=.05+Math.random()*2.9;
  const env=w<.6?w/.6:(w>2.1?(3-w)/.9:1);
  const vol=.08+.3*env*Math.random();
  noise(.045,1200+Math.random()*2200,1.1,vol,'bandpass',w);
  noise(.035,600+Math.random()*500,2,vol*.7,'bandpass',w)}}
function cheerCrowd(){const a=A(),t=a.currentTime,len=3.2;
 const n=a.sampleRate*len,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
 for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
 const s=a.createBufferSource();s.buffer=b;
 const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=1100;f.Q.value=.5;
 const g=a.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.45,t+.3);g.gain.setValueAtTime(.45,t+1.8);g.gain.linearRampToValueAtTime(0,t+len);
 const lfo=a.createOscillator(),lg=a.createGain();lfo.frequency.value=6;lg.gain.value=.1;lfo.connect(lg);lg.connect(g.gain);
 s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);lfo.start(t);s.stop(t+len);lfo.stop(t+len);
 for(let i=0;i<16;i++){const st=t+Math.random()*.9,du=.5+Math.random()*.7,base=200+Math.random()*350;
  const o=a.createOscillator(),vg=a.createGain(),fl=a.createBiquadFilter(),vb=a.createOscillator(),vd=a.createGain();
  o.type='sawtooth';o.frequency.setValueAtTime(base,st);o.frequency.linearRampToValueAtTime(base*1.35,st+du*.35);o.frequency.linearRampToValueAtTime(base*1.1,st+du);
  vb.frequency.value=5+Math.random()*2;vd.gain.value=base*.03;vb.connect(vd);vd.connect(o.frequency);
  fl.type='bandpass';fl.frequency.value=700+Math.random()*500;fl.Q.value=1.2;
  vg.gain.setValueAtTime(0,st);vg.gain.linearRampToValueAtTime(.07,st+.08);vg.gain.exponentialRampToValueAtTime(.001,st+du);
  o.connect(fl);fl.connect(vg);vg.connect(a.destination);o.start(st);vb.start(st);o.stop(st+du+.05);vb.stop(st+du+.05)}
 for(let i=0;i<45;i++)noise(.04,2500,1,.22,'bandpass',.4+Math.random()*2.4)}
function cheerOld(){for(let i=0;i<7;i++){noise(.9,600+Math.random()*900,1.5,.18,'bandpass',i*.12+Math.random()*.15)}
 for(let i=0;i<8;i++)noise(.05,3000+Math.random()*2000,2,.25,'highpass',.2+i*.14+Math.random()*.1)} /* cheers + clapping */
function gentle(){const a=A(),t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(520,t);o.frequency.linearRampToValueAtTime(420,t+.25);
 g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+.32)}

/* ---------- confetti ---------- */
let parts=[],raf=0;
function size(){cv.width=innerWidth;cv.height=innerHeight}addEventListener('resize',size);size();
function confetti(x,y){const cols=['#ff5c8a','#ffd23f','#3ec46d','#4db8ff','#b06cff','#ff9142'];
 for(let i=0;i<110;i++){const a=Math.random()*Math.PI*2,s=4+Math.random()*9;
  parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6,w:6+Math.random()*7,h:4+Math.random()*6,r:Math.random()*6,vr:Math.random()*.4-.2,c:cols[i%6],l:110+Math.random()*50})}
 if(!raf)raf=requestAnimationFrame(tick)}
function tick(){cx.clearRect(0,0,cv.width,cv.height);
 parts=parts.filter(p=>p.l>0);
 parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.3;p.vx*=.99;p.r+=p.vr;p.l--;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.globalAlpha=Math.min(1,p.l/30);cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()});
 raf=parts.length?requestAnimationFrame(tick):0;if(!raf)cx.clearRect(0,0,cv.width,cv.height)}

/* ---------- speech recognition ---------- */
const norm=s=>' '+s.toLowerCase().replace(/[^a-z ]/g,' ').replace(/\s+/g,' ')+' ';
function matches(text){const t=norm(text);return cur.f.some(w=>t.includes(' '+w+' ')||t.includes(' '+w+'s '))}
function startRec(){
 if(!SR||recOn)return;
 if(!rec){rec=new SR();rec.lang='en-GB';rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=4;
  rec.onstart=()=>{recOn=true;handled=-1;mic.classList.add('on')};
  rec.onend=()=>{recOn=false;if(playing&&!noMic)setTimeout(startRec,900)};
  rec.onerror=e=>{recOn=false;if(e.error==='not-allowed'||e.error==='service-not-allowed'){noMic=true;mic.classList.remove('on')}};
  rec.onresult=e=>{
   const idx=e.results.length-1;
   if(speaking||busy||!cur||Date.now()<ignoreUntil){handled=idx;return}
   if(idx<=handled)return;
   const r=e.results[idx];
   let ok=false;for(let i=0;i<r.length;i++)if(matches(r[i].transcript))ok=true;
   if(ok)success();else if(r.isFinal){handled=idx;fail()}}}
 try{rec.start()}catch(_){}}
mic.onclick=()=>{A();startRec()};

/* ---------- game flow ---------- */
const clear=()=>{timers.forEach(clearTimeout);timers=[]};
function next(){if(!bag.length)bag=ITEMS.map((_,i)=>i).sort(()=>Math.random()-.5);return ITEMS[bag.pop()]}
function round(){
 clear();busy=false;wrong=0;cur=next();
 bubble.className='';void bubble.offsetWidth;
 face.textContent=cur.e;
 bubble.style.left=(8+Math.random()*(innerWidth-bubble.offsetWidth-16))+'px';
 bubble.style.marginLeft='0';
 bubble.classList.add('fall');
 say('What is in the bubble?');
 timers.push(setTimeout(()=>{if(!busy&&!speaking)say('What is in the bubble?')},12000));
 timers.push(setTimeout(()=>{if(!busy&&!speaking)say('Can you tell me what you see?')},19000));
 startRec()}
bubble.addEventListener('animationend',e=>{
 if(e.animationName!=='fall'||busy)return;
 busy=true;clear();gentle();bubble.className='pop';
 say("Oh, "+is(cur)+"! Let's try another one.").then(()=>setTimeout(round,500))});
function fail(){
 if(busy||speaking)return;
 wrong++;NO++;showScore();gentle();
 bubble.classList.remove('wobble');void bubble.offsetWidth;
 const pos=bubble.getBoundingClientRect().top;bubble.style.top=pos+'px';
 bubble.classList.remove('fall');bubble.style.animation='wob .5s ease';
 setTimeout(()=>{bubble.style.animation='';bubble.style.top='';
  const rem=Math.max(4,FALL*(1-pos/(innerHeight+260)));
  bubble.style.animation='';bubble.style.top=pos+'px';
  bubble.style.transition='none';
  bubble.animate([{top:pos+'px'},{top:(innerHeight-40)+'px'}],{duration:rem*1000,easing:'linear',fill:'forwards'}).onfinish=()=>{
   if(busy)return;busy=true;clear();gentle();bubble.className='pop';
   say("Oh, "+is(cur)+"! Let's try another one.").then(()=>setTimeout(()=>{bubble.getAnimations().forEach(a=>a.cancel());bubble.style.top='';round()},500))};
 },500);
 if(wrong>=3){wrong=0;say("Try again! "+cap(is(cur))+". Can you say "+cur.n+"?")}else say('Try again!')}
function success(){
 if(busy)return;busy=true;clear();OK++;showScore();speechSynthesis.cancel();speaking=false;
 const r=bubble.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
 bubble.getAnimations().forEach(a=>a.pause());
 popSound();bubble.classList.add('pop');
 setTimeout(()=>{fanfare();cheer();confetti(x,y);confetti(innerWidth*.2,innerHeight*.3);confetti(innerWidth*.8,innerHeight*.3)},180);
 const praise=['Well done!','Brilliant!','Hooray, you did it!','Super clever!','Yippee, that is right!'];
 setTimeout(()=>say(cap(is(cur))+"!").then(()=>setTimeout(()=>{bubble.getAnimations().forEach(a=>a.cancel());bubble.style.top='';round()},700)),2200)}
bubble.onclick=()=>{A();
 if(busy||!cur)return;
 if(!SR||noMic){success();return}
 say(cap(is(cur))+". Can you say "+cur.n+"?")};

/* speed setting: slider 0 (slowest, 28s) to 10 (fastest, 8s) */
let FALL=24;
const sp=$('speed');
function setFall(v){FALL=28-2*v;document.documentElement.style.setProperty('--fall',FALL+'s')}
try{const s=localStorage.getItem('bubbleSpeed');if(s!==null)sp.value=s}catch(_){}
setFall(+sp.value);
sp.oninput=()=>{setFall(+sp.value);try{localStorage.setItem('bubbleSpeed',sp.value)}catch(_){}};
sp.onchange=()=>{if(playing&&!busy)round()};
let OK=0,NO=0;
try{const s=JSON.parse(localStorage.getItem('bubbleScore')||'[0,0]');OK=s[0]|0;NO=s[1]|0}catch(_){}
function showScore(){$('ok').textContent=OK;$('no').textContent=NO;try{localStorage.setItem('bubbleScore',JSON.stringify([OK,NO]))}catch(_){}}
showScore();
