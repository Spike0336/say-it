<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Decorate the Christmas Tree!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive, sans-serif;
      background: linear-gradient(180deg, #0a1628 0%, #1a3a5c 40%, #2d5a3d 100%);
      min-height: 100vh;
      overflow: hidden;
      color: white;
      position: relative;
    }

    /* Falling snow */
    .snowflake {
      position: fixed;
      top: -20px;
      color: white;
      font-size: 1.2em;
      opacity: 0.8;
      animation: fall linear infinite;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes fall {
      to {
        transform: translateY(105vh) rotate(360deg);
      }
    }

    header {
      text-align: center;
      padding: 12px 10px 8px;
      position: relative;
      z-index: 10;
    }

    h1 {
      font-size: clamp(1.4rem, 5vw, 2.2rem);
      text-shadow: 0 0 10px #ffd700, 0 0 20px #ff6b6b;
      animation: glow 2s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px #ffd700, 0 0 20px #ff6b6b; }
      to { text-shadow: 0 0 20px #ffd700, 0 0 40px #ff6b6b, 0 0 60px #00ff88; }
    }

    .subtitle {
      font-size: clamp(0.9rem, 3vw, 1.1rem);
      opacity: 0.9;
      margin-top: 4px;
    }

    .game-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: calc(100vh - 90px);
      position: relative;
      z-index: 5;
    }

    /* Tree container */
    .tree-container {
      position: relative;
      width: min(90vw, 380px);
      height: min(55vh, 420px);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      margin-top: 5px;
    }

    .tree {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* CSS Christmas Tree layers */
    .tree-layer {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-style: solid;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
    }

    .layer1 {
      bottom: 18%;
      border-width: 0 110px 140px 110px;
      border-color: transparent transparent #1a7a3a transparent;
    }

    .layer2 {
      bottom: 32%;
      border-width: 0 95px 120px 95px;
      border-color: transparent transparent #228b22 transparent;
    }

    .layer3 {
      bottom: 45%;
      border-width: 0 80px 100px 80px;
      border-color: transparent transparent #2e8b2e transparent;
    }

    .layer4 {
      bottom: 56%;
      border-width: 0 65px 85px 65px;
      border-color: transparent transparent #3cb371 transparent;
    }

    .trunk {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 36px;
      height: 55px;
      background: linear-gradient(90deg, #5d3a1a, #8b5a2b, #5d3a1a);
      border-radius: 4px;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
    }

    /* Decoration drop zone overlay */
    .drop-zone {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 85%;
      z-index: 20;
      cursor: pointer;
    }

    /* Placed decorations on tree */
    .placed-decoration {
      position: absolute;
      font-size: 1.8rem;
      cursor: grab;
      transition: transform 0.15s ease;
      z-index: 25;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.4));
      touch-action: none;
    }

    .placed-decoration:active {
      cursor: grabbing;
      transform: scale(1.2);
    }

    .placed-decoration.star {
      font-size: 2.8rem;
      z-index: 30;
      animation: star-twinkle 1.5s ease-in-out infinite;
    }

    @keyframes star-twinkle {
      0%, 100% { transform: scale(1) rotate(0deg); filter: drop-shadow(0 0 8px gold); }
      50% { transform: scale(1.15) rotate(10deg); filter: drop-shadow(0 0 20px gold); }
    }

    /* Decoration tray */
    .tray {
      position: relative;
      width: 100%;
      max-width: 500px;
      padding: 10px 8px 20px;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 20px 20px 0 0;
      margin-top: auto;
      z-index: 15;
      backdrop-filter: blur(6px);
    }

    .tray-title {
      text-align: center;
      font-size: 1.1rem;
      margin-bottom: 8px;
      color: #ffd700;
    }

    .decorations-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      padding: 0 4px;
    }

    .deco-btn {
      width: 52px;
      height: 52px;
      font-size: 1.9rem;
      background: rgba(255, 255, 255, 0.15);
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      touch-action: manipulation;
    }

    .deco-btn:hover, .deco-btn:active {
      transform: scale(1.15);
      background: rgba(255, 255, 255, 0.3);
      border-color: #ffd700;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
    }

    .deco-btn.selected {
      background: rgba(255, 215, 0, 0.4);
      border-color: #ffd700;
      box-shadow: 0 0 20px gold;
      transform: scale(1.1);
    }

    .counter {
      text-align: center;
      margin-top: 8px;
      font-size: 1rem;
      color: #a0e0ff;
    }

    .counter span {
      color: #ffd700;
      font-weight: bold;
      font-size: 1.2rem;
    }

    /* Celebration overlay */
    .celebration {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .celebration.active {
      display: flex;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .celebration h2 {
      font-size: clamp(2rem, 8vw, 3.5rem);
      color: #ffd700;
      text-shadow: 0 0 20px #ff6b6b, 0 0 40px #00ff88;
      animation: bounce 0.8s ease infinite;
      margin-bottom: 10px;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-15px) scale(1.05); }
    }

    .celebration p {
      font-size: clamp(1.2rem, 4vw, 1.8rem);
      margin: 10px 0 25px;
      color: #fff;
    }

    .celebration .big-emoji {
      font-size: 4rem;
      animation: spin 2s linear infinite;
      margin: 15px 0;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .play-again {
      background: linear-gradient(135deg, #ff6b6b, #ffd700);
      color: #1a1a2e;
      border: none;
      padding: 16px 36px;
      font-size: 1.3rem;
      font-family: inherit;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255, 107, 107, 0.5);
      transition: transform 0.2s;
    }

    .play-again:hover, .play-again:active {
      transform: scale(1.08);
    }

    /* Confetti canvas */
    #confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
    }

    /* Lights effect on tree */
    .tree-lights {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 15;
      opacity: 0;
      transition: opacity 1s;
    }

    .tree-lights.on {
      opacity: 1;
    }

    .light {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      animation: twinkle 1.2s ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.4; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    /* Instruction tip */
    .tip {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 215, 0, 0.9);
      color: #1a1a2e;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: bold;
      z-index: 40;
      white-space: nowrap;
      animation: tipPulse 2s ease infinite;
    }

    @keyframes tipPulse {
      0%, 100% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.05); }
    }

    .tip.hidden {
      display: none;
    }

    /* Responsive tweaks */
    @media (max-height: 700px) {
      .tree-container {
        height: min(48vh, 360px);
      }
      .deco-btn {
        width: 46px;
        height: 46px;
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>
  <div id="snow-container"></div>
  <canvas id="confetti"></canvas>

  <header>
    <h1>🎄 Decorate the Tree! 🎄</h1>
    <p class="subtitle">Tap a decoration, then tap the tree!</p>
  </header>

  <div class="game-area">
    <div class="tip" id="tip">👆 Pick a decoration below!</div>

    <div class="tree-container">
      <div class="tree" id="tree">
        <div class="tree-layer layer4"></div>
        <div class="tree-layer layer3"></div>
        <div class="tree-layer layer2"></div>
        <div class="tree-layer layer1"></div>
        <div class="trunk"></div>
        <div class="tree-lights" id="treeLights"></div>
        <div class="drop-zone" id="dropZone"></div>
      </div>
    </div>

    <div class="tray">
      <div class="tray-title">✨ Choose decorations ✨</div>
      <div class="decorations-grid" id="decoGrid"></div>
      <div class="counter">Decorations: <span id="count">0</span> / <span id="goal">12</span></div>
    </div>
  </div>

  <div class="celebration" id="celebration">
    <div class="big-emoji">🎉</div>
    <h2>Merry Christmas!</h2>
    <p>Your tree looks AMAZING! 🌟</p>
    <div class="big-emoji">🎄✨🎁</div>
    <button class="play-again" id="playAgain">Decorate Again! 🔄</button>
  </div>

  <script>
    // ===== CONFIG =====
    const GOAL = 12; // decorations needed to win
    const DECORATIONS = [
      { emoji: '🔴', name: 'red bauble' },
      { emoji: '🔵', name: 'blue bauble' },
      { emoji: '🟡', name: 'gold bauble' },
      { emoji: '🟢', name: 'green bauble' },
      { emoji: '🟣', name: 'purple bauble' },
      { emoji: '⭐', name: 'star', special: 'star' },
      { emoji: '🌟', name: 'sparkle star' },
      { emoji: '🎀', name: 'bow' },
      { emoji: '🎁', name: 'gift' },
      { emoji: '🔔', name: 'bell' },
      { emoji: '🕯️', name: 'candle' },
      { emoji: '❄️', name: 'snowflake' },
      { emoji: '🎅', name: 'Santa' },
      { emoji: '🦌', name: 'reindeer' },
      { emoji: '🧦', name: 'stocking' },
      { emoji: '🍭', name: 'candy' },
      { emoji: '🍪', name: 'cookie' },
      { emoji: '❤️', name: 'heart' },
      { emoji: '🎄', name: 'mini tree' },
      { emoji: '✨', name: 'sparkles' },
      { emoji: '💫', name: 'dizzy star' },
      { emoji: '🎀', name: 'pink bow' },
      { emoji: '🟡', name: 'yellow ball' },
      { emoji: '🟠', name: 'orange bauble' }
    ];

    // ===== STATE =====
    let selectedDeco = null;
    let placedCount = 0;
    let hasStar = false;
    let isCelebrating = false;
    let placedElements = [];

    // ===== DOM =====
    const decoGrid = document.getElementById('decoGrid');
    const dropZone = document.getElementById('dropZone');
    const countEl = document.getElementById('count');
    const goalEl = document.getElementById('goal');
    const tip = document.getElementById('tip');
    const celebration = document.getElementById('celebration');
    const playAgainBtn = document.getElementById('playAgain');
    const treeLights = document.getElementById('treeLights');
    const confettiCanvas = document.getElementById('confetti');
    const ctx = confettiCanvas.getContext('2d');

    goalEl.textContent = GOAL;

    // ===== BUILD DECORATION BUTTONS =====
    DECORATIONS.forEach((deco, i) => {
      const btn = document.createElement('button');
      btn.className = 'deco-btn';
      btn.textContent = deco.emoji;
      btn.title = deco.name;
      btn.dataset.index = i;
      btn.addEventListener('click', () => selectDecoration(i, btn));
      decoGrid.appendChild(btn);
    });

    function selectDecoration(index, btn) {
      if (isCelebrating) return;
      // deselect previous
      document.querySelectorAll('.deco-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedDeco = DECORATIONS[index];
      tip.textContent = '👆 Now tap the tree!';
      tip.classList.remove('hidden');
    }

    // ===== PLACE ON TREE =====
    dropZone.addEventListener('click', (e) => {
      if (!selectedDeco || isCelebrating) return;

      const rect = dropZone.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      // Keep decorations roughly on the tree shape (triangle-ish)
      const relX = x / rect.width;
      const relY = y / rect.height;
      // Simple bounds check - allow a bit of freedom
      if (relY > 0.92) return; // too low (trunk)

      placeDecoration(x, y, selectedDeco);
    });

    // Also support touch
    dropZone.addEventListener('touchend', (e) => {
      e.preventDefault();
      if (!selectedDeco || isCelebrating) return;
      const touch = e.changedTouches[0];
      const rect = dropZone.getBoundingClientRect();
      const x = touch.clientX - rect.left;
      const y = touch.clientY - rect.top;
      const relY = y / rect.height;
      if (relY > 0.92) return;
      placeDecoration(x, y, selectedDeco);
    }, { passive: false });

    function placeDecoration(x, y, deco) {
      const el = document.createElement('div');
      el.className = 'placed-decoration';
      if (deco.special === 'star') {
        el.classList.add('star');
        // Stars go near the top
        y = Math.min(y, 40);
        hasStar = true;
      }
      el.textContent = deco.emoji;
      el.style.left = (x - 16) + 'px';
      el.style.top = (y - 16) + 'px';

      // Make placed items also draggable a bit
      makeDraggable(el);

      document.getElementById('tree').appendChild(el);
      placedElements.push(el);
      placedCount++;
      countEl.textContent = placedCount;

      // Clear selection
      selectedDeco = null;
      document.querySelectorAll('.deco-btn').forEach(b => b.classList.remove('selected'));
      tip.classList.add('hidden');

      // Little pop animation
      el.style.transform = 'scale(0)';
      requestAnimationFrame(() => {
        el.style.transition = 'transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1)';
        el.style.transform = 'scale(1)';
      });

      // Check win
      if (placedCount >= GOAL) {
        setTimeout(startCelebration, 400);
      }
    }

    function makeDraggable(el) {
      let startX, startY, origX, origY;
      el.addEventListener('touchstart', (e) => {
        if (isCelebrating) return;
        const t = e.touches[0];
        startX = t.clientX;
        startY = t.clientY;
        origX = parseFloat(el.style.left);
        origY = parseFloat(el.style.top);
      }, { passive: true });

      el.addEventListener('touchmove', (e) => {
        if (isCelebrating) return;
        e.preventDefault();
        const t = e.touches[0];
        const dx = t.clientX - startX;
        const dy = t.clientY - startY;
        el.style.left = (origX + dx) + 'px';
        el.style.top = (origY + dy) + 'px';
      }, { passive: false });
    }

    // ===== LIGHTS =====
    function createLights() {
      const colors = ['#ff0000', '#00ff00', '#ffff00', '#ff00ff', '#00ffff', '#ff8800', '#ffffff'];
      // Approximate positions on the triangular tree
      const positions = [
        [50, 12], [35, 22], [65, 22],
        [25, 35], [50, 32], [75, 35],
        [20, 48], [40, 45], [60, 45], [80, 48],
        [15, 62], [35, 58], [55, 58], [75, 62],
        [25, 72], [50, 70], [70, 72]
      ];
      positions.forEach((pos, i) => {
        const light = document.createElement('div');
        light.className = 'light';
        light.style.left = pos[0] + '%';
        light.style.top = pos[1] + '%';
        light.style.background = colors[i % colors.length];
        light.style.boxShadow = `0 0 8px ${colors[i % colors.length]}`;
        light.style.animationDelay = (i * 0.15) + 's';
        treeLights.appendChild(light);
      });
    }
    createLights();

    // ===== CELEBRATION =====
    function startCelebration() {
      if (isCelebrating) return;
      isCelebrating = true;
      treeLights.classList.add('on');
      celebration.classList.add('active');
      launchConfetti();
      // Extra fun: make all decorations bounce a bit
      placedElements.forEach((el, i) => {
        el.style.animation = `bounce 0.6s ease ${i * 0.05}s infinite`;
      });
    }

    playAgainBtn.addEventListener('click', resetGame);

    function resetGame() {
      isCelebrating = false;
      placedCount = 0;
      hasStar = false;
      countEl.textContent = '0';
      celebration.classList.remove('active');
      treeLights.classList.remove('on');
      placedElements.forEach(el => el.remove());
      placedElements = [];
      stopConfetti();
      tip.textContent = '👆 Pick a decoration below!';
      tip.classList.remove('hidden');
      selectedDeco = null;
      document.querySelectorAll('.deco-btn').forEach(b => b.classList.remove('selected'));
    }

    // ===== SNOW =====
    function createSnow() {
      const container = document.getElementById('snow-container');
      const flakes = ['❄', '❅', '❆', '✦', '✧'];
      for (let i = 0; i < 35; i++) {
        const flake = document.createElement('div');
        flake.className = 'snowflake';
        flake.textContent = flakes[Math.floor(Math.random() * flakes.length)];
        flake.style.left = Math.random() * 100 + 'vw';
        flake.style.fontSize = (0.6 + Math.random() * 1.2) + 'em';
        flake.style.animationDuration = (6 + Math.random() * 12) + 's';
        flake.style.animationDelay = (Math.random() * 8) + 's';
        flake.style.opacity = 0.4 + Math.random() * 0.5;
        container.appendChild(flake);
      }
    }
    createSnow();

    // ===== CONFETTI =====
    let confettiParticles = [];
    let confettiAnimId = null;

    function launchConfetti() {
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
      confettiParticles = [];
      const colors = ['#ff0000', '#00ff00', '#ffff00', '#ff00ff', '#00ffff', '#ff8800', '#ffffff', '#ffd700'];
      for (let i = 0; i < 180; i++) {
        confettiParticles.push({
          x: Math.random() * confettiCanvas.width,
          y: Math.random() * confettiCanvas.height - confettiCanvas.height,
          w: 6 + Math.random() * 8,
          h: 4 + Math.random() * 6,
          color: colors[Math.floor(Math.random() * colors.length)],
          speed: 2 + Math.random() * 4,
          rot: Math.random() * 360,
          rotSpeed: -4 + Math.random() * 8,
          sway: Math.random() * 2
        });
      }
      animateConfetti();
    }

    function animateConfetti() {
      ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      confettiParticles.forEach(p => {
        p.y += p.speed;
        p.x += Math.sin(p.y * 0.02) * p.sway;
        p.rot += p.rotSpeed;
        if (p.y > confettiCanvas.height + 20) {
          p.y = -20;
          p.x = Math.random() * confettiCanvas.width;
        }
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot * Math.PI / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      });
      confettiAnimId = requestAnimationFrame(animateConfetti);
    }

    function stopConfetti() {
      if (confettiAnimId) cancelAnimationFrame(confettiAnimId);
      confettiAnimId = null;
      ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      confettiParticles = [];
    }

    // Resize confetti canvas
    window.addEventListener('resize', () => {
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
