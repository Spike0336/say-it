<meta charset="utf-8">
<title>What Are You Doing?</title>

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff8e1;--ink:#3a2e1f;--card:#fff;--ring:#ff7043}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2433;--ink:#fff3d6;--card:#3b3348}}
:root[data-theme="dark"]{--bg:#2a2433;--ink:#fff3d6;--card:#3b3348}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Comic Sans MS","Trebuchet MS",system-ui,sans-serif;text-align:center;padding:12px}
h1{margin:6px 0;font-size:1.7rem}
#bubble{min-height:64px;margin:8px auto;max-width:480px;background:#fff;color:#3a2e1f;border:4px solid var(--ring);border-radius:24px;padding:12px 16px;font-size:1.5rem;font-weight:bold;display:flex;align-items:center;justify-content:center}
#ask{font:inherit;font-size:1.2rem;font-weight:bold;background:var(--ring);color:#fff;border:0;border-radius:30px;padding:12px 24px;margin:4px 0 10px}
#ask:disabled{opacity:.4}
#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:5px solid transparent;border-radius:20px;padding:0;cursor:pointer;overflow:hidden}
.card.sel{border-color:var(--ring);transform:scale(1.03)}
.card svg{width:100%;display:block}
.card.talk svg{animation:bob .4s infinite alternate}
@keyframes bob{to{transform:translateY(-5px)}}
</style>
</head>

function svg(a){
 const arms=a.arms.map(r=>`<line x1="${r[0]}" y1="${r[1]}" x2="${r[2]}" y2="${r[3]}" stroke="${SK}" stroke-width="10" stroke-linecap="round"/>`).join("");
 const boy=`<rect x="85" y="140" width="12" height="40" fill="#5c6bc0"/><rect x="103" y="140" width="12" height="40" fill="#5c6bc0"/><rect x="78" y="95" width="44" height="50" rx="10" fill="${a.shirt}"/>${arms}<circle cx="100" cy="72" r="26" fill="${SK}"/><path d="M74 68 Q78 42 100 44 Q122 42 126 68 Q110 54 74 68Z" fill="#6d4c41"/><circle cx="91" cy="72" r="3" fill="#333"/><circle cx="109" cy="72" r="3" fill="#333"/><path d="M92 84 Q100 92 108 84" stroke="#c0392b" stroke-width="3" fill="none" stroke-linecap="round"/>`;
 return `<svg viewBox="0 0 200 200" role="img" aria-label="${a.say}"><rect width="200" height="200" fill="${a.bg}"/>${a.front?boy+a.prop:a.prop.replace(/^/,"")+boy+(a.arms.length?"":"")}</svg>`;
}
let cur=null;
const grid=document.getElementById("grid"),bub=document.getElementById("bubble"),ask=document.getElementById("ask");
acts.forEach((a,i)=>{
 const b=document.createElement("button");b.className="card";b.innerHTML=svg(a);
 b.onclick=()=>select(i);grid.appendChild(b);
});
const cards=[...document.querySelectorAll(".card")];
function select(i){
 cur=i;cards.forEach((c,j)=>c.classList.toggle("sel",i===j));
 ask.disabled=false;bub.textContent="Say: “What are you doing?”";listen();
}
function reply(){
 const t=acts[cur].say;bub.textContent=t;
 cards[cur].classList.add("talk");
 try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.pitch=1.5;u.rate=.95;
  u.onend=()=>cards[cur]&&cards[cur].classList.remove("talk");speechSynthesis.speak(u);}catch(e){}
 setTimeout(()=>cards.forEach(c=>c.classList.remove("talk")),2500);
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
function listen(){
 if(!SR||cur===null)return;
 try{rec&&rec.abort();}catch(e){}
 rec=new SR();rec.lang="en-GB";rec.interimResults=false;rec.maxAlternatives=3;
 rec.onresult=e=>{
  const heard=[...e.results[0]].map(r=>r.transcript.toLowerCase()).join(" ");
  if(/doing|what are you|what're you/.test(heard))reply();
  else bub.textContent="Say: “What are you doing?”";
 };
 rec.onerror=()=>{bub.textContent="Tap 🎤 Ask him!"};
 try{rec.start();}catch(e){}
}
ask.onclick=()=>{if(cur!==null)reply();};
