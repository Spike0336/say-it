<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Count With Me!</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,"Segoe UI",Roboto,sans-serif;background:#7fd0ff}
#scene{position:fixed;inset:0;width:100%;height:100%}
.cloud{animation:drift 70s linear infinite}.cloud.c2{animation-duration:110s;animation-delay:-40s}.cloud.c3{animation-duration:90s;animation-delay:-70s}
@keyframes drift{from{transform:translateX(-260px)}to{transform:translateX(1000px)}}
.blades{transform-box:fill-box;transform-origin:center;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;z-index:5;pointer-events:none}
#hud>*{pointer-events:auto}
.pill{background:#ffffffd9;border-radius:30px;padding:8px 16px;font-weight:800;color:#1b5e45;text-decoration:none;box-shadow:0 2px 8px #0003;font-size:1rem}
#stars{font-size:1.3rem;color:#c77700}
#q{position:fixed;left:50%;top:calc(58px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:92vw;text-align:center;font-weight:900;font-size:clamp(1.3rem,5.2vmin,2.6rem);color:#fff;background:#2e7d5bd9;border-radius:28px;padding:10px 24px;z-index:4;box-shadow:0 4px 14px #0004;text-shadow:0 2px 0 #1b5e45}
#field{position:fixed;left:4%;right:4%;top:24%;bottom:19%;z-index:2}
.obj{position:absolute;display:flex;align-items:center;justify-content:center;line-height:1;user-select:none;filter:drop-shadow(0 6px 4px #0003);animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.obj.wiggle{animation:wig 1.6s ease-in-out infinite}
@keyframes pop{from{transform:scale(0) rotate(-30deg)}to{transform:scale(1) rotate(0)}}
@keyframes wig{50%{transform:translateY(-6px) rotate(3deg)}}
.obj.count{animation:cnt .7s ease both}
@keyframes cnt{30%{transform:scale(1.45) rotate(-6deg)}100%{transform:scale(1)}}
.obj.boom{animation:boom .6s ease-in forwards}
@keyframes boom{40%{transform:scale(1.9) rotate(18deg);filter:brightness(1.5)}100%{transform:scale(3) rotate(40deg);opacity:0}}
.badge{position:absolute;top:-18%;right:-14%;width:1.2em;height:1.2em;border-radius:50%;background:#e53935;color:#fff;font-weight:900;font-size:.42em;display:flex;align-items:center;justify-content:center;border:.08em solid #fff;font-family:system-ui,sans-serif}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:8}
#bottom{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
#mic{display:flex;align-items:center;gap:10px;background:#fffffff0;border-radius:40px;padding:10px 22px;font-weight:800;font-size:1.15rem;color:#555;box-shadow:0 3px 12px #0003;min-height:52px}
#mic.on{color:#c62828}#mic.on .mi{animation:pulse 1s infinite}
.mi{font-size:1.7rem}@keyframes pulse{50%{transform:scale(1.25)}}
#heard{font-weight:600;color:#666;margin-left:6px}
#pad{display:none;gap:6px;flex-wrap:wrap;justify-content:center}
#pad button{width:46px;height:46px;border-radius:50%;font-size:1.3rem;font-weight:900;background:#fff;color:#1b5e45}
.row{display:flex;gap:10px}
button{font:inherit;border:0;border-radius:40px;padding:10px 18px;background:#ffffffd9;color:#1b5e45;font-weight:800;cursor:pointer;box-shadow:0 2px 8px #0003}
button:active{transform:scale(.95)}
#start{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#0000002e;padding:16px}
#start .card{background:#fffffff2;border-radius:30px;padding:22px 20px;text-align:center;max-width:460px;width:100%;box-shadow:0 10px 40px #0005}
#start h1{margin:0 0 4px;font-size:2.1rem;color:#1b5e45}
#start .em{font-size:2.6rem;letter-spacing:.1em;margin:6px 0}
#start p{margin:6px 0 14px;color:#555;font-size:1.05rem}
#start .big{display:block;width:100%;margin:8px 0;font-size:1.5rem;padding:16px;color:#fff;background:#2e9e6a;box-shadow:0 4px 0 #1b6b47}
#start .big.two{background:#f08a24;box-shadow:0 4px 0 #b5620f}
#msg{margin-top:6px;color:#b71c1c;font-weight:700;min-height:1.2em}
@media(prefers-reduced-motion:reduce){.cloud,.blades{animation:none}}
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 800 500" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
<defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6ec6ff"/><stop offset="1" stop-color="#e2f6ff"/></linearGradient>
<radialGradient id="sg"><stop offset="0" stop-color="#fff7b0"/><stop offset="1" stop-color="#fff7b0" stop-opacity="0"/></radialGradient></defs>
<rect width="800" height="500" fill="url(#sk)"/>
<circle cx="690" cy="92" r="92" fill="url(#sg)"/><circle cx="690" cy="92" r="38" fill="#ffe066"/>
<g class="cloud"><ellipse cx="120" cy="90" rx="52" ry="16" fill="#fff"/><ellipse cx="150" cy="78" rx="34" ry="15" fill="#fff"/><ellipse cx="96" cy="80" rx="28" ry="12" fill="#fff"/></g>
<g class="cloud c2"><ellipse cx="300" cy="140" rx="44" ry="13" fill="#fff" opacity=".95"/><ellipse cx="322" cy="130" rx="28" ry="12" fill="#fff" opacity=".95"/></g>
<g class="cloud c3"><ellipse cx="520" cy="60" rx="50" ry="14" fill="#fff"/><ellipse cx="548" cy="50" rx="30" ry="13" fill="#fff"/></g>
<path d="M0 300Q120 236 260 288T520 276T800 262V500H0Z" fill="#a8e0a0"/>
<g><rect x="590" y="236" width="86" height="56" fill="#d9453b"/><polygon points="582,238 633,200 684,238" fill="#8e2a24"/><rect x="618" y="256" width="30" height="36" fill="#fff" opacity=".9"/><path d="M618 256L648 292M648 256L618 292" stroke="#d9453b" stroke-width="4"/><rect x="684" y="214" width="26" height="78" rx="4" fill="#cfd8dc"/><path d="M684 214Q697 196 710 214Z" fill="#90a4ae"/></g>
<g><polygon points="168,300 184,300 180,216 172,216" fill="#f5f0e6"/><g class="blades"><rect x="130" y="214" width="96" height="6" rx="3" fill="#8d6e63"/><rect x="175" y="170" width="6" height="96" rx="3" fill="#8d6e63"/></g><circle cx="178" cy="217" r="7" fill="#c9503d"/></g>
<path d="M0 345Q200 282 400 332T800 318V500H0Z" fill="#86d27f"/>
<polygon points="468,334 566,326 610,364 500,378" fill="#f4d96b"/><polygon points="500,378 610,364 650,400 530,414" fill="#e6c24f"/><polygon points="230,330 330,338 300,372 200,360" fill="#9bd160"/>
<path d="M60 345V312M96 340V312" stroke="#8d6e63" stroke-width="6"/><circle cx="78" cy="296" r="26" fill="#3f9d4a"/><circle cx="60" cy="312" r="18" fill="#4caf50"/><circle cx="98" cy="310" r="18" fill="#4caf50"/>
<path d="M722 330V296" stroke="#8d6e63" stroke-width="7"/><circle cx="722" cy="280" r="28" fill="#3f9d4a"/><circle cx="702" cy="296" r="18" fill="#4caf50"/><circle cx="744" cy="296" r="18" fill="#4caf50"/>
<path d="M380 500Q395 430 470 392Q500 378 520 374" stroke="#ecd7a8" stroke-width="40" fill="none" stroke-linecap="round"/>
<path d="M0 404Q250 354 500 400T800 384V500H0Z" fill="#62bb68"/>
<g stroke="#a07a55" stroke-width="5" stroke-linecap="round"><path d="M0 396L330 410M0 410L330 424"/>
<path d="M18 388V428M78 391V431M138 394V434M198 397V437M258 400V440M318 404V444"/></g>
<g><circle cx="420" cy="470" r="5" fill="#ff6f91"/><circle cx="450" cy="486" r="5" fill="#fff"/><circle cx="520" cy="462" r="5" fill="#ffd54f"/><circle cx="600" cy="480" r="5" fill="#ff6f91"/><circle cx="660" cy="458" r="5" fill="#fff"/><circle cx="740" cy="474" r="5" fill="#ffd54f"/><circle cx="60" cy="470" r="5" fill="#ffd54f"/><circle cx="120" cy="488" r="5" fill="#ff6f91"/><circle cx="250" cy="472" r="5" fill="#fff"/></g>
</svg>
<div id="hud"><a class="pill" href="../">🏠 All games</a><div class="pill" id="stars">⭐ 0</div></div>
<div id="q" style="display:none"></div>
<div id="field"></div>
<canvas id="fx"></canvas>
<div id="bottom" style="display:none">
  <div id="mic"><span class="mi">🎤</span><span id="micTxt">Listening…</span><span id="heard"></span></div>
  <div id="pad"></div>
  <div class="row"><button id="skip">⏭ Next</button><button id="stop">⏹ Stop</button></div>
</div>
<div id="start"><div class="card">
  <div class="em">🐑🐄🚜🎈</div>
  <h1>Count With Me!</h1>
  <p>Count the things in the picture and say the number out loud!</p>
  <button class="big" id="go5">▶ Count to 5</button>
  <button class="big two" id="go10">▶ Count to 10</button>
  <div id="msg"></div>
</div></div>
<script>
const $=id=>document.getElementById(id);
// ---------- pictures ----------
const KINDS={
 people:[['👦','boys'],['👧','girls'],['👶','babies'],['👨','men'],['👩','women'],['🧑‍🌾','farmers'],['👵','grannies'],['👴','grandpas'],['🧒','children'],['👮','police officers']],
 animals:[['🐑','sheep'],['🐄','cows'],['🐖','pigs'],['🐔','hens'],['🦆','ducks'],['🐴','horses'],['🐕','dogs'],['🐈','cats'],['🐇','rabbits'],['🐸','frogs'],['🦋','butterflies'],['🐝','bees'],['🐞','ladybirds'],['🐦','birds'],['🐟','fish'],['🦉','owls'],['🐿️','squirrels']],
 objects:[['🍎','apples'],['🍌','bananas'],['🍓','strawberries'],['🎈','balloons'],['⚽','footballs'],['🌸','flowers'],['⭐','stars'],['🎁','presents'],['🧸','teddy bears'],['🍪','biscuits'],['🍦','ice creams'],['🌻','sunflowers'],['🍄','mushrooms'],['🥕','carrots'],['🏠','houses'],['🌳','trees'],['☂️','umbrellas'],['🧁','cakes'],['🍩','doughnuts'],['🪁','kites'],['🎩','hats']],
 vehicles:[['🚗','cars'],['🚌','buses'],['🚜','tractors'],['🚲','bicycles'],['✈️','aeroplanes'],['🚂','trains'],['🚁','helicopters'],['⛵','boats'],['🚒','fire engines'],['🚓','police cars'],['🚑','ambulances'],['🏍️','motorbikes'],['🛴','scooters'],['🚀','rockets']]
};
const CATS=Object.keys(KINDS);
const IRREG={sheep:'sheep',fish:'fish',children:'child',men:'man',women:'woman',buses:'bus'};
const sing=p=>IRREG[p]||(/ies$/.test(p)?p.slice(0,-3)+'y':p.replace(/s$/,''));
const unit=(k,n)=>n===1?sing(k[1]):k[1];
const WORD=['zero','one','two','three','four','five','six','seven','eight','nine','ten'];
const pick=a=>a[Math.floor(Math.random()*a.length)];
// ---------- narrator ----------
let voice=null;
function pickVoice(){const v=speechSynthesis.getVoices();voice=v.find(x=>/en-GB/i.test(x.lang)&&/female|google|serena|kate|libby|sonia/i.test(x.name))||v.find(x=>/en-GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(text,rate){return new Promise(res=>{if(!('speechSynthesis' in window))return setTimeout(res,600);speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);if(voice)u.voice=voice;u.lang='en-GB';u.rate=rate||.9;u.pitch=1.12;u.onend=res;u.onerror=res;speechSynthesis.speak(u)})}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
// ---------- sounds ----------
let ac;
function audio(){ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.resume)ac.resume();return ac}
function fanfare(){
  const a=audio();
  [[523,0],[659,.12],[784,.24],[1047,.36],[784,.52],[1047,.64],[1319,.78]].forEach(([f,t],i)=>{const o=a.createOscillator(),g=a.createGain();o.type=i>4?'square':'triangle';o.frequency.value=f;o.connect(g);g.connect(a.destination);const s=a.currentTime+t;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.25,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+(i===6?.9:.3));o.start(s);o.stop(s+1)});
}
function popSound(){
  const a=audio(),t=a.currentTime;
  const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(620,t);o.frequency.exponentialRampToValueAtTime(90,t+.2);o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.start(t);o.stop(t+.25);
  const n=a.createBuffer(1,a.sampleRate*.12,a.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
  const s=a.createBufferSource(),g2=a.createGain();s.buffer=n;g2.gain.value=.18;s.connect(g2);g2.connect(a.destination);s.start(t);
}
// ---------- explosion effects ----------
const cv=$('fx'),cx=cv.getContext('2d');
let parts=[],rings=[],flash=0,fxRun=false;
function sizeCanvas(){cv.width=innerWidth;cv.height=innerHeight}
addEventListener('resize',sizeCanvas);sizeCanvas();
const COLS=['#ff5252','#ffd740','#69f0ae','#40c4ff','#e040fb','#ff9100','#ffffff'];
function burst(x,y){
  for(let i=0;i<34;i++){const a=Math.random()*Math.PI*2,sp=3+Math.random()*10;parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3,r:3+Math.random()*7,c:pick(COLS),life:60+Math.random()*50,star:Math.random()<.35,rot:Math.random()*6})}
  rings.push({x,y,r:10,a:1});flash=.5;
  if(!fxRun){fxRun=true;requestAnimationFrame(tick)}
}
function star(x,y,r,rot){cx.beginPath();for(let k=0;k<10;k++){const a=rot+k*Math.PI/5-Math.PI/2,rr=k%2?r*.45:r;cx.lineTo(x+rr*Math.cos(a),y+rr*Math.sin(a))}cx.closePath();cx.fill()}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  if(flash>0){cx.fillStyle=`rgba(255,255,220,${flash})`;cx.fillRect(0,0,cv.width,cv.height);flash-=.04}
  rings.forEach(g=>{g.r+=9;g.a-=.035;if(g.a>0){cx.strokeStyle=`rgba(255,255,255,${g.a})`;cx.lineWidth=8;cx.beginPath();cx.arc(g.x,g.y,g.r,0,7);cx.stroke()}});
  rings=rings.filter(g=>g.a>0);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.22;p.vx*=.985;p.life--;p.rot+=.15;cx.globalAlpha=Math.max(0,Math.min(1,p.life/30));cx.fillStyle=p.c;if(p.star)star(p.x,p.y,p.r*1.6,p.rot);else{cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill()}});
  cx.globalAlpha=1;parts=parts.filter(p=>p.life>0);
  if(parts.length||rings.length||flash>0)requestAnimationFrame(tick);else{fxRun=false;cx.clearRect(0,0,cv.width,cv.height)}
}
// ---------- layout ----------
const field=$('field');
let objs=[],cur=null,roundId=0,running=false,stars=0,maxN=5,lastN=0,lastKind='',catIdx=Math.floor(Math.random()*4),phase=1,resolved=true;
function buildObjects(kind,n){
  field.innerHTML='';objs=[];
  const W=field.clientWidth||innerWidth*.92,H=field.clientHeight||innerHeight*.55;
  const cols=Math.max(1,Math.min(n,Math.ceil(Math.sqrt(n*W/H)))),rows=Math.ceil(n/cols);
  const cw=W/cols,ch=H/rows,size=Math.max(46,Math.min(150,Math.min(cw,ch)*.82));
  const cells=[];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)cells.push([c,r]);
  for(let i=cells.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cells[i],cells[j]]=[cells[j],cells[i]]}
  const vmin=Math.min(innerWidth,innerHeight)/100;
  cells.slice(0,n).forEach(([c,r],i)=>{
    const jx=(Math.random()-.5)*Math.max(0,cw-size)*.7,jy=(Math.random()-.5)*Math.max(0,ch-size)*.7;
    const el=document.createElement('div');el.className='obj';el.textContent=kind[0];
    el.style.fontSize=(size*.82/vmin)+'vmin';el.style.width=el.style.height=(size/vmin)+'vmin';
    el.style.left=((c*cw+cw/2+jx-size/2)/W*100)+'%';el.style.top=((r*ch+ch/2+jy-size/2)/H*100)+'%';
    el.style.animationDelay=(i*70)+'ms';
    el.addEventListener('animationend',e=>{if(e.animationName==='pop')el.classList.add('wiggle')});
    field.appendChild(el);objs.push(el);
  });
}
function newPicture(){
  let kind,n;
  do{catIdx=(catIdx+1)%CATS.length;kind=pick(KINDS[CATS[catIdx]])}while(kind[1]===lastKind);
  do{n=1+Math.floor(Math.random()*maxN)}while(n===lastN&&maxN>1);
  lastKind=kind[1];lastN=n;return {kind,n};
}
// ---------- understanding the child ----------
const NUMW={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,won:1,to:2,too:2,tree:3,free:3,for:4,fore:4,fife:5,sicks:6,ate:8,tin:10};
const STRICT=new Set(['one','two','three','four','five','six','seven','eight','nine','ten','tree','free','fife']);
function nums(t){
  const toks=String(t).toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(Boolean),loose=toks.length<=2,out=[];
  for(const w of toks){
    if(/^\d+$/.test(w)){const v=+w;if(v>=1&&v<=10)out.push(v);continue}
    if(Object.prototype.hasOwnProperty.call(NUMW,w)&&(STRICT.has(w)||loose))out.push(NUMW[w]);
  }
  return out;
}
// ---------- microphone ----------
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,timers=[];
function clearTimers(){timers.forEach(clearTimeout);timers=[]}
function setMic(on,txt){$('mic').classList.toggle('on',on);$('micTxt').textContent=txt||(on?'Listening…':'');}
function stopRec(){if(rec){const r=rec;rec=null;try{r.abort()}catch(e){}}setMic(false,'')}
function startRec(id){
  if(!SR){setMic(false,'Tap the number');return}
  stopRec();
  const r=new SR();rec=r;r.lang='en-GB';r.continuous=true;r.interimResults=true;r.maxAlternatives=3;
  r.onresult=e=>{
    if(resolved||id!==roundId)return;
    const res=e.results[e.results.length-1],alts=[...res].map(a=>a.transcript);
    $('heard').textContent='“'+alts[0].trim()+'”';
    if(alts.some(t=>{const n=nums(t);return n.length&&n[n.length-1]===cur.n}))return answered(true);
    if(res.isFinal&&alts.some(t=>nums(t).length))answered(false);
  };
  r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){$('msg').textContent='';halt('Microphone blocked — allow it in the browser’s site settings, then tap Start.')}};
  r.onend=()=>{if(!resolved&&running&&rec===r){try{r.start()}catch(e){}}};
  try{r.start();setMic(true,'Listening…')}catch(e){}
}
// ---------- the game ----------
function buildPad(){
  const p=$('pad');p.innerHTML='';
  for(let i=1;i<=maxN;i++){const b=document.createElement('button');b.textContent=i;b.onclick=()=>{if(!resolved)answered(i===cur.n)};p.appendChild(b)}
  p.style.display=SR?'none':'flex';
}
async function round(){
  const id=++roundId;resolved=true;phase=1;clearTimers();stopRec();$('heard').textContent='';
  cur=newPicture();buildObjects(cur.kind,cur.n);
  const q=`How many ${cur.kind[1]} can you see?`;
  $('q').style.display='block';$('q').textContent=q;
  await say(q);
  if(!running||id!==roundId)return;
  resolved=false;startRec(id);
  timers=[setTimeout(()=>{if(!resolved&&id===roundId)say('Have a go! How many can you see?')},10000),setTimeout(()=>{if(!resolved&&id===roundId)answered(false,true)},22000)];
}
async function answered(ok,silent){
  if(resolved)return;resolved=true;clearTimers();stopRec();const id=roundId;
  if(ok)return celebrate(id);
  if(phase===1)return help(id,silent);
  await say('Good trying! Let’s try another one.');if(running&&id===roundId)round();
}
async function celebrate(id){
  stars++;$('stars').textContent='⭐ '+stars;fanfare();
  const rects=objs.map(o=>o.getBoundingClientRect());
  objs.forEach((o,i)=>{o.classList.remove('wiggle');o.style.animationDelay=(i*90)+'ms';o.classList.add('boom');
    setTimeout(()=>{popSound();burst(rects[i].left+rects[i].width/2,rects[i].top+rects[i].height/2)},i*90+120)});
  const n=cur.n,nm=n===1?'one':WORD[n];
  const praise=pick(['Yes!','Brilliant!','Well done!','Hooray!','Amazing!','Super counting!']);
  let line=`${praise} ${nm[0].toUpperCase()+nm.slice(1)}! ${n===1?'There is':'There are'} ${nm} ${unit(cur.kind,n)}!`;
  if(stars%5===0)line+=' You are a superstar!';
  await Promise.all([say(line),wait(objs.length*90+1300)]);
  if(running&&id===roundId)round();
}
async function help(id,silent){
  phase=2;
  await say(silent?'Let’s count them together!':'Nearly! Let’s count them together!');
  if(!running||id!==roundId)return;
  const order=[...objs].sort((a,b)=>(a.offsetLeft-b.offsetLeft)||(a.offsetTop-b.offsetTop));
  for(let i=0;i<order.length;i++){
    if(!running||id!==roundId)return;
    const o=order[i];o.classList.remove('wiggle');o.classList.remove('count');o.offsetWidth;o.classList.add('count');
    const b=document.createElement('div');b.className='badge';b.textContent=i+1;o.appendChild(b);
    await say(WORD[i+1],.85);await wait(250);
  }
  if(!running||id!==roundId)return;
  await say(`${cur.n===1?'There is':'There are'} ${WORD[cur.n]} ${unit(cur.kind,cur.n)}. Now you say it!`);
  if(!running||id!==roundId)return;
  resolved=false;startRec(id);
  timers=[setTimeout(()=>{if(!resolved&&id===roundId)answered(false,true)},9000)];
}
function halt(text){
  running=false;resolved=true;roundId++;clearTimers();stopRec();speechSynthesis.cancel();
  $('q').style.display='none';$('bottom').style.display='none';field.innerHTML='';
  $('start').style.display='flex';$('msg').textContent=text||'';
}
async function begin(n){
  maxN=n;running=true;stars=0;lastN=0;$('stars').textContent='⭐ 0';$('msg').textContent='';
  audio();$('start').style.display='none';$('bottom').style.display='flex';buildPad();
  await say('Let’s count!');
  if(running)round();
}
$('go5').onclick=()=>begin(5);
$('go10').onclick=()=>begin(10);
$('skip').onclick=()=>{if(running){speechSynthesis.cancel();round()}};
$('stop').onclick=()=>{const s=stars;halt(s?`Great counting! You got ${s} ⭐`:'');if(s)say(`Great counting! You got ${s} ${s===1?'star':'stars'}!`)};
</script>
