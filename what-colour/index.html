<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What Colour?</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff4c2;--card:#ffffff;--ink:#3b2a6b;--btn:#7c4dff;--btn2:#ff7aa8;--btn3:#2bb673}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2250;--card:#3a3170;--ink:#fff4c2}}
:root[data-theme="dark"]{--bg:#2a2250;--card:#3a3170;--ink:#fff4c2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Comic Sans MS","Trebuchet MS",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12px;overflow:hidden;user-select:none}
#stage{flex:1;display:flex;align-items:center;justify-content:center;width:100%;max-width:700px}
#card{background:var(--card);border-radius:40px;box-shadow:0 8px 0 rgba(0,0,0,.15);width:min(86vw,52vh);aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:min(48vw,30vh);line-height:1}
#card.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
#card.dance{animation:dance .7s infinite}
@keyframes dance{0%,100%{transform:rotate(-6deg) scale(1.05)}50%{transform:rotate(6deg) scale(1.15)}}
#bar{display:flex;gap:16px;justify-content:center;width:100%;padding:10px 0 14px}
.big{border:0;border-radius:36px;color:#fff;font-size:min(14vw,9vh);width:min(28vw,18vh);height:min(28vw,18vh);cursor:pointer;box-shadow:0 8px 0 rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center}
.big:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
#mic{background:var(--btn);width:min(36vw,22vh);height:min(36vw,22vh);font-size:min(18vw,11vh)}
#mic.on{background:#ff3d71;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
#again{background:var(--btn3)}#skip{background:var(--btn2)}
#sw{display:none;flex-wrap:wrap;gap:12px;justify-content:center;padding:4px 0}
#sw button{width:min(17vw,11vh);height:min(17vw,11vh);border-radius:50%;border:4px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.2);cursor:pointer}
#start{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;z-index:5;padding-top:env(safe-area-inset-top,0px)}
#start .big{width:min(60vw,36vh);height:min(60vw,36vh);background:var(--btn3);font-size:min(30vw,18vh);border-radius:50%}
#start h1{font-size:min(12vw,8vh);margin:0}
#conf{position:fixed;inset:0;pointer-events:none;z-index:4}
</style>
</head>
<body>
<div id="start"><h1>🌈 What Colour?</h1><button class="big" id="go" aria-label="Play">▶️</button></div>
<canvas id="conf"></canvas>
<div id="stage"><div id="card"></div></div>
<div id="sw"></div>
<div id="bar">
  <button class="big" id="again" aria-label="Hear again">🔊</button>
  <button class="big" id="mic" aria-label="Talk">🎤</button>
  <button class="big" id="skip" aria-label="Next">➡️</button>
</div>
<script>
const ITEMS=[["🍎","red"],["🍓","red"],["🚒","red"],["🍌","yellow"],["🐥","yellow"],["🌻","yellow"],["🐸","green"],["🥦","green"],["🌳","green"],["🐳","blue"],["🫐","blue"],["🚙","blue"],["🍊","orange"],["🥕","orange"],["🎃","orange"],["🍇","purple"],["🍆","purple"],["🐷","pink"],["🌸","pink"],["🎀","pink"],["🐻","brown"],["🍫","brown"],["🥔","brown"],["☁️","white"],["⛄","white"],["🥚","white"],["🕷️","black"],["🐈‍⬛","black"],["🎩","black"],["🕶️","black"]];
const HEX={red:"#e53935",yellow:"#fdd835",green:"#43a047",blue:"#1e88e5",orange:"#fb8c00",purple:"#8e24aa",pink:"#f48fb1",brown:"#795548",white:"#ffffff",black:"#212121"};
const SYN={purple:["purple","violet"],pink:["pink"],white:["white","wait"],black:["black","block","back"],brown:["brown","brow"],blue:["blue","blew"],red:["red","read"],green:["green"],yellow:["yellow"],orange:["orange"]};
const PRAISE=["Well done!","Brilliant!","Hooray!","Super!","Clever you!","Fantastic!"];
const $=id=>document.getElementById(id);
let order=[],idx=0,cur=null,voice=null,rec=null,listening=false,busy=false,tries=0,askTimer=null,AC=null;

function pickVoice(){
  const vs=speechSynthesis.getVoices();
  const gb=vs.filter(v=>/en[-_]GB/i.test(v.lang));
  const fem=/female|serena|kate|martha|hazel|libby|sonia|susan|fiona|stephanie|amy|emma|olivia|google uk english female/i;
  voice=gb.find(v=>fem.test(v.name))||gb.find(v=>!/male|daniel|oliver|arthur|george|ryan/i.test(v.name))||gb[0]||vs.find(v=>/^en/i.test(v.lang))||null;
}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(t,done){
  if(!("speechSynthesis" in window)){done&&setTimeout(done,800);return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);
  u.lang="en-GB";if(voice)u.voice=voice;u.rate=.85;u.pitch=1.25;
  let fin=false;const f=()=>{if(!fin){fin=true;done&&done()}};
  u.onend=f;u.onerror=f;setTimeout(f,Math.max(2800,t.length*140+1200));
  speechSynthesis.speak(u);
}
function fanfare(){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const n=[[523,0],[659,.12],[784,.24],[1047,.4],[784,.6],[1047,.72],[1319,.9]];
    n.forEach(([f,t])=>{
      ["square","triangle"].forEach((type,i)=>{
        const o=AC.createOscillator(),g=AC.createGain();
        o.type=type;o.frequency.value=f;
        const s=AC.currentTime+t;
        g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(i?.25:.08,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+.5);
        o.connect(g).connect(AC.destination);o.start(s);o.stop(s+.55);
      });
    });
  }catch(e){}
}
function confetti(){
  const c=$("conf"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const P=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*4,vy:3+Math.random()*6,r:6+Math.random()*8,c:Object.values(HEX)[Math.floor(Math.random()*8)]}));
  let t=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;x.fillStyle=p.c;x.fillRect(p.x,p.y,p.r,p.r)});if(++t<110)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})();
}
function show(){
  cur=ITEMS[order[idx]];tries=0;busy=false;
  const card=$("card");card.className="";card.textContent=cur[0];void card.offsetWidth;card.className="pop";
  ask();
}
function ask(){
  stopRec();clearTimeout(askTimer);
  say("What colour is it?",()=>{if(!busy)startRec()});
}
function stopRec(){listening=false;$("mic").classList.remove("on");if(rec){const r=rec;rec=null;r.onresult=r.onerror=r.onend=null;try{r.abort()}catch(e){}}}
function startRec(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){$("sw").style.display="flex";return}
  stopRec();
  rec=new SR();rec.lang="en-GB";rec.maxAlternatives=6;rec.interimResults=true;rec.continuous=false;
  listening=true;$("mic").classList.add("on");
  rec.onresult=e=>{
    const words=[];
    for(let i=e.resultIndex;i<e.results.length;i++)for(let j=0;j<e.results[i].length;j++)words.push(e.results[i][j].transcript.toLowerCase());
    const txt=words.join(" ");
    if(SYN[cur[1]].some(w=>new RegExp("\\b"+w+"\\b").test(txt)))correct();
  };
  rec.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed"){listening=false;$("mic").classList.remove("on");$("sw").style.display="flex"}};
  rec.onend=()=>{
    $("mic").classList.remove("on");
    if(!listening||busy)return;
    tries++;
    // gentle, cheerful re-ask — never a failure message
    if(tries%3===0){ask()}else{setTimeout(()=>{if(listening&&!busy)startRec()},250)}
  };
  try{rec.start()}catch(e){setTimeout(()=>{if(listening&&!busy)startRec()},400)}
}
function correct(){
  if(busy)return;busy=true;stopRec();
  const card=$("card");card.className="dance";
  fanfare();confetti();
  setTimeout(()=>say(PRAISE[Math.floor(Math.random()*PRAISE.length)]+" It's "+cur[1]+"!",()=>setTimeout(next,700)),900);
}
function next(){
  idx++;
  if(idx>=order.length){
    $("card").className="dance";$("card").textContent="🏆";fanfare();confetti();
    say("You did it! All finished!",()=>setTimeout(()=>{shuffle();idx=0;show()},1500));
    return;
  }
  show();
}
function shuffle(){order=ITEMS.map((_,i)=>i);for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}}
// fallback colour swatches (shown only if the microphone isn't available)
Object.keys(HEX).forEach(k=>{const b=document.createElement("button");b.style.background=HEX[k];b.setAttribute("aria-label",k);b.onclick=()=>{if(k===cur[1])correct();else say("Have another look!")};$("sw").appendChild(b)});

$("go").onclick=()=>{
  $("start").style.display="none";
  try{AC=new (window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}
  speechSynthesis.cancel();pickVoice();shuffle();idx=0;show();
};
$("again").onclick=ask;
$("mic").onclick=()=>{if(busy)return;speechSynthesis.cancel();listening?(stopRec()):startRec()};
$("skip").onclick=()=>{speechSynthesis.cancel();stopRec();next()};
</script>
</body>
</html>
