.hud{position:absolute;top:10px;background:rgba(30,12,8,.75);color:#ffe9b0;border-radius:30px;padding:8px 16px;font-size:20px;border:2px solid #e8b923}
#prog{left:10px;display:flex;align-items:center;gap:10px}
#bar{width:150px;height:16px;background:#4a1c1c;border-radius:9px;overflow:hidden}#fill{height:100%;width:0;background:linear-gradient(90deg,#ffd23b,#ff7a1a);transition:width .4s}
#again{right:10px;cursor:pointer}
#tools{display:none;left:50%;transform:translateX(-50%);gap:8px;padding:6px 10px}
#tools button{font-size:30px;width:58px;height:58px;border-radius:50%;border:3px solid #e8b923;background:#7a1f1f;cursor:pointer}
#tools button:active,.pb:active{transform:scale(.9)}
#hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(30,12,8,.8);color:#ffe9b0;padding:8px 18px;border-radius:20px;font-size:19px;pointer-events:none;white-space:nowrap}
#pal{background:linear-gradient(#3b1b12,#24100a);border-top:4px solid #e8b923;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center}
.tab{font-size:18px;padding:10px 12px;border-radius:14px;border:3px solid #e8b923;background:#7a1f1f;color:#ffe9b0;cursor:pointer;flex:none}.tab.on{background:#1f7a3a}
#row{display:flex;gap:8px;overflow-x:auto;flex:1;padding:2px}
.pb{flex:none;width:76px;height:76px;border-radius:16px;border:3px solid #6e4a2a;background:rgba(255,235,190,.16);cursor:pointer;padding:0}
.pb svg{width:100%;height:100%}
#win{display:none;position:fixed;inset:0;background:rgba(10,5,20,.35);align-items:center;justify-content:center;flex-direction:column;color:#fff;text-align:center;z-index:5}
#win h1{font-size:min(11vw,90px);margin:0;color:#ffd23b;text-shadow:0 4px 0 #b3261e,0 0 30px #ff9a1f;animation:bn 1s infinite alternate}
@keyframes bn{to{transform:scale(1.08) rotate(2deg)}}
#win p{font-size:min(5vw,34px);margin:10px 0 20px;text-shadow:0 2px 6px #000}
#win button{font-size:26px;padding:14px 30px;border-radius:40px;border:4px solid #fff;background:#1f9d55;color:#fff;cursor:pointer}
#cf{position:fixed;inset:0;pointer-events:none;z-index:6}

const P=[['#d21f2b','#e8b923',80,70],['#1f9d55','#d21f2b',70,60],['#2a5fd0','#c9d2da',90,80],['#8a3fc0','#f06ea9',64,64],['#e8b923','#d21f2b',60,86],['#f4f4f4','#2a5fd0',86,56],['#f06ea9','#ffffff',72,72],['#0e7c7b','#e8b923',96,64]].map(a=>pres(...a));
const LIST=[D,P];let tab=0,sel=null,won=false;
function show(t){tab=t;document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('on',i==t));
$('row').innerHTML=LIST[t].map((m,i)=>`<button class='pb' data-i='${i}'><svg viewBox='-48 -48 96 96'>${t?`<g transform='scale(.62)'>${m}</g>`:m}</svg></button>`).join('')}
const up=g=>{const d=g.d;g.setAttribute('transform',`translate(${d.x} ${d.y}) rotate(${d.r}) scale(${d.s})`)};
function add(t,m,x,y,s,r){const g=document.createElementNS(NS,'g');g.setAttribute('class','it');g.innerHTML=`<g class='in' style='animation-delay:${(R()*.8).toFixed(2)}s'>${m}</g>`;g.d={t,m,x,y,s,r};up(g);L.appendChild(g);select(g);pop(880);check();return g}
function spawn(t,i){$('hint').style.display='none';const m=LIST[t][i];
if(t){add(1,m,TX-240+R()*480,785+R()*45,1.3,(R()-.5)*20)}else{const y=170+R()*480;add(0,m,TX+(R()-.5)*((y-100)*.5),y,1,(R()-.5)*30)}}
function select(g){if(sel)sel.classList.remove('sel');sel=g;if(g){g.classList.add('sel');L.appendChild(g)}$('tools').style.display=g?'flex':'none'}
const inTree=d=>d.t==0&&d.y>110&&d.y<745&&Math.abs(d.x-TX)<(d.y-100)*.37+25;
function check(){const n=[...L.children].filter(g=>inTree(g.d)).length;$('cnt').textContent=Math.min(n,GOAL)+' / '+GOAL;$('fill').style.width=Math.min(100,n/GOAL*100)+'%';
if(n>=GOAL&&!won){won=true;party()}if(n<GOAL&&won){won=false;svg.classList.remove('party')}}
const pt=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())};
let drag=null;
svg.addEventListener('pointerdown',e=>{const g=e.target.closest('.it');if(!g){select(null);return}select(g);const p=pt(e);drag={g,dx:g.d.x-p.x,dy:g.d.y-p.y};e.preventDefault()});
addEventListener('pointermove',e=>{if(!drag)return;const p=pt(e),d=drag.g.d;d.x=Math.max(0,Math.min(1600,p.x+drag.dx));d.y=Math.max(0,Math.min(900,p.y+drag.dy));up(drag.g)});
addEventListener('pointerup',()=>{if(drag){drag=null;check()}});
svg.addEventListener('wheel',e=>{if(sel){act(e.deltaY<0?'s+':'s-');e.preventDefault()}},{passive:false});
function act(a){if(!sel)return;const d=sel.d;
if(a=='s+')d.s=Math.min(4,d.s*1.15);else if(a=='s-')d.s=Math.max(.3,d.s/1.15);else if(a=='r+')d.r+=15;else if(a=='r-')d.r-=15;
else if(a=='d'){add(d.t,d.m,d.x+35,d.y+35,d.s,d.r);return}
else if(a=='x'){sel.remove();select(null);pop(300);check();return}up(sel);check()}
$('tools').addEventListener('click',e=>{const b=e.target.closest('button');if(b)act(b.dataset.a)});
$('pal').addEventListener('click',e=>{const t=e.target.closest('.tab');if(t){show(+t.dataset.t);return}const b=e.target.closest('.pb');if(b)spawn(tab,+b.dataset.i)});
addEventListener('keydown',e=>{if(e.key=='Delete'||e.key=='Backspace')act('x');if(e.key=='Escape')select(null)});
$('again').onclick=()=>{L.innerHTML='';select(null);won=false;svg.classList.remove('party');check();$('hint').style.display=''};
// sound
let AC;function tone(f,t,d,v=.15,ty='sine'){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;o.connect(g);g.connect(AC.destination);const s=AC.currentTime+t;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.start(s);o.stop(s+d)}catch(x){}}
const pop=f=>tone(f,0,.12,.1);
// celebration
function party(){svg.classList.add('party');$('win').style.display='flex';let t=0;[[659,.2],[659,.2],[659,.4],[659,.2],[659,.2],[659,.4],[659,.2],[784,.2],[523,.3],[587,.1],[659,.7]].forEach(([f,d])=>{tone(f,t,d+.2,.18,'triangle');t+=d});confetti()}
$('ok').onclick=()=>$('win').style.display='none';
const cv=$('cf'),cx=cv.getContext('2d');let ps=[],run=false;
function confetti(){cv.width=innerWidth;cv.height=innerHeight;const burst=()=>{for(let i=0;i<180;i++)ps.push({x:Math.random()*cv.width,y:-20-Math.random()*300,vx:(Math.random()-.5)*4,vy:2+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.3,w:8+Math.random()*8,c:`hsl(${Math.random()*360},90%,60%)`})};
burst();setTimeout(burst,1500);setTimeout(burst,3000);setTimeout(burst,4500);if(!run){run=true;(function f(){cx.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.w/4,p.w,p.w/2);cx.restore()});ps=ps.filter(p=>p.y<cv.height+30);if(ps.length||$('win').style.display=='flex')requestAnimationFrame(f);else run=false})()}}
show(0);
</script></body></html>
