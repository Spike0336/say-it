<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:#fff3c4;font-family:"Comic Sans MS","Chalkboard SE",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;flex-wrap:wrap}
.tabs,.tools{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;border:0;border-radius:16px;background:#fff;box-shadow:0 3px 0 #0003;cursor:pointer;touch-action:manipulation}
.tab{padding:6px 12px;font-size:18px}
.tab.on{background:#ff9f1c;color:#fff}
.tool{width:48px;height:48px;font-size:24px;padding:0}
.tool:disabled{opacity:.35}
#clear{width:auto;padding:0 12px;font-size:16px}
#scene{flex:1;position:relative;overflow:hidden;margin:0 8px;border-radius:22px;box-shadow:0 4px 0 #0003;min-height:0}
#bg,#bg svg{position:absolute;inset:0;width:100%;height:100%}
#layer{position:absolute;inset:0}
.st{position:absolute;font-size:calc(var(--u,60px)*var(--s,1));line-height:1;cursor:grab;touch-action:none;filter:drop-shadow(0 3px 2px #0004);animation:pop .25s ease-out}
.st.sel{filter:drop-shadow(0 0 4px #fff) drop-shadow(0 0 8px #ff9f1c)}
@keyframes pop{from{scale:.2}to{scale:1}}
#tray{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:8px 10px;margin:8px 8px 8px;background:#fff9;border-radius:22px;touch-action:pan-x;transition:background .15s}
#tray.del{background:#ff6b6b}
.ti{flex:0 0 auto;width:68px;height:68px;font-size:42px;line-height:1;padding:0;touch-action:pan-x}
.pp{display:flex;flex-direction:column;align-items:center}.pp b{font-weight:400;line-height:1;display:block}.pp svg{width:.62em;height:.74em;margin-top:-.3em;display:block;overflow:visible}.pr{position:absolute;right:-.2em;bottom:.05em;font-size:.42em;font-style:normal;line-height:1}.ti.pt{font-size:36px;justify-content:flex-start;overflow:hidden}
.hint{font-size:13px;text-align:center;color:#6b5400;margin:-2px 0 2px}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite}
@keyframes sway{50%{rotate:5deg}}
.rise{animation:rise 7s linear infinite}
@keyframes rise{from{translate:0 0;opacity:.8}to{translate:0 -520px;opacity:0}}
</style></head>

function place(el,o){el.style.left=o.x+"%";el.style.top=o.y+"%";el.style.setProperty("--s",o.s);el.style.transform=`translate(-50%,-50%) scaleX(${o.f?-1:1})`}
function mark(){[...layer.children].forEach(c=>c.classList.toggle("sel",c._o===sel));["sm","bg2","fl","del"].forEach(i=>$(i).disabled=!sel)}
function fill(el,o){
 if(!o.c){el.textContent=o.e;return}
 el.classList.add("pp");const k=o.c[0],t=o.c[1];
 el.innerHTML=`<b>${o.e}</b><svg viewBox="0 0 60 74"><rect x="4" y="2" width="9" height="34" rx="4" fill="${k}"/><rect x="47" y="2" width="9" height="34" rx="4" fill="${k}"/><circle cx="8.5" cy="38" r="5" fill="#f1c27d"/><circle cx="51.5" cy="38" r="5" fill="#f1c27d"/><rect x="12" y="0" width="36" height="42" rx="8" fill="${k}"/><rect x="14" y="38" width="15" height="30" rx="4" fill="${t}"/><rect x="31" y="38" width="15" height="30" rx="4" fill="${t}"/><ellipse cx="21" cy="70" rx="10" ry="4.5" fill="#222"/><ellipse cx="39" cy="70" rx="10" ry="4.5" fill="#222"/></svg>`+(o.p?`<i class="pr">${o.p}</i>`:"");
}
function mk(o){
 const el=document.createElement("div");el.className="st";fill(el,o);el._o=o;place(el,o);
 el.addEventListener("pointerdown",ev=>{
  ev.preventDefault();sel=o;const a=data[scene];a.splice(a.indexOf(o),1);a.push(o);layer.appendChild(el);mark();
  const r=sc.getBoundingClientRect();
  drag={o,el,dx:o.x-(ev.clientX-r.left)/r.width*100,dy:o.y-(ev.clientY-r.top)/r.height*100};
 });
 return el;
}
function add(e,x,y,m){const o={e,x,y,s:1,f:false,...m};data[scene].push(o);const el=mk(o);layer.appendChild(el);sel=o;mark();save();return el}
function render(){
 $("bg").innerHTML=BG[scene];layer.innerHTML="";sel=null;

 tray.innerHTML="";

  const b=document.createElement("button");b.className="ti";if(A){b.classList.add("pt");fill(b,{e,...meta})}else b.textContent=e;

 mark();size();
}
const overTray=ev=>ev.clientY>tray.getBoundingClientRect().top;
addEventListener("pointermove",ev=>{
 if(tp&&!drag&&tp.y-ev.clientY>14){

  data[scene].push(o);const el=mk(o);layer.appendChild(el);sel=o;mark();drag={o,el,dx:0,dy:0};tp=null;
 }
 if(!drag)return;
 const r=sc.getBoundingClientRect();

 drag.o.y=clamp((ev.clientY-r.top)/r.height*100+drag.dy,0,100);
 place(drag.el,drag.o);tray.classList.toggle("del",overTray(ev));
});
addEventListener("pointerup",ev=>{

 }else if(tp){add(tp.e,15+Math.random()*70,25+Math.random()*55,tp.meta)}
