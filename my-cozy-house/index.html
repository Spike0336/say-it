<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Cozy House</title>
<style>
:root{--bg:#fdf3e3;--ink:#4a3328;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1d17;--ink:#f6e6d2;--card:#3b2a21}}
:root[data-theme="dark"]{--bg:#2a1d17;--ink:#f6e6d2;--card:#3b2a21}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:8px}
h1{margin:4px 0;font-size:22px}
#wrap{width:100%;max-width:900px}
#room{position:relative;width:100%;aspect-ratio:16/10;container-type:inline-size;overflow:hidden;border-radius:14px;border:4px solid #5b3a24;touch-action:none;background:var(--wall,#e9b8a0)}
#wall{position:absolute;inset:0 0 38% 0;background:var(--wall,#e9b8a0);background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 2cqw,rgba(0,0,0,.04) 2cqw 4cqw);box-shadow:inset 0 -2cqw 4cqw rgba(0,0,0,.12)}
#floor{position:absolute;inset:62% 0 0 0;background:var(--floor,#b9854f);background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.12) 0 .4cqw,transparent .4cqw 9cqw),repeating-linear-gradient(0deg,rgba(0,0,0,.06) 0 .3cqw,transparent .3cqw 6cqw);box-shadow:inset 0 3cqw 4cqw rgba(0,0,0,.25)}
#skirt{position:absolute;left:0;right:0;top:60%;height:2.4%;background:#f4ead8;box-shadow:0 .3cqw .6cqw rgba(0,0,0,.3)}
.r-bath #wall{background-image:linear-gradient(rgba(255,255,255,.55) 0 .25cqw,transparent .25cqw),linear-gradient(90deg,rgba(255,255,255,.55) 0 .25cqw,transparent .25cqw);background-size:5cqw 5cqw}
.r-bath #floor,.r-kit #floor{background-image:repeating-conic-gradient(rgba(0,0,0,.13) 0 25%,transparent 0 50%);background-size:8cqw 8cqw}
.r-garden #skirt{display:none}
.r-garden #wall{background-image:linear-gradient(rgba(255,255,255,0),rgba(255,255,255,.35));box-shadow:none}
.r-garden #floor{background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 .6cqw,transparent .6cqw 3cqw);box-shadow:inset 0 1cqw 2cqw rgba(0,0,0,.2)}
#glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 62%,rgba(255,150,40,.38),rgba(255,120,20,.12) 40%,transparent 70%);animation:glow 2.4s infinite ease-in-out;mix-blend-mode:screen;z-index:9000}
@keyframes glow{0%,100%{opacity:.8}30%{opacity:1}60%{opacity:.65}}
.win{position:absolute;top:9%;width:17%;height:34%;background:linear-gradient(#10204a,#3a4f8f 60%,#f0a860);border:1cqw solid #f4ead8;border-radius:.6cqw;box-shadow:0 0 0 .4cqw #b79a78,inset 0 0 3cqw rgba(0,0,0,.4);overflow:hidden}
.win.day{background:linear-gradient(#8fd0ff,#e4f5ff)}
.win.frost{background:linear-gradient(#cfe9f5,#f2fbff)}
.win:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:.9cqw;margin-left:-.45cqw;background:#f4ead8}
.win:after{content:"";position:absolute;top:50%;left:0;right:0;height:.9cqw;margin-top:-.45cqw;background:#f4ead8}
.win i{position:absolute;font-style:normal;font-size:2cqw}
.curt{position:absolute;top:-1%;width:4cqw;height:40%;background:linear-gradient(90deg,#c0504d,#e07a76,#c0504d);border-radius:0 0 1cqw 1cqw;box-shadow:0 0 1cqw rgba(0,0,0,.3)}
#door{position:absolute;left:3%;top:10%;width:13%;height:54%;background:linear-gradient(90deg,#7a4a2a,#935b34,#7a4a2a);border:.9cqw solid #f4ead8;border-bottom:0;border-radius:1cqw 1cqw 0 0;box-shadow:0 0 1cqw rgba(0,0,0,.4)}
#door:before,#door:after{content:"";position:absolute;left:14%;width:72%;height:36%;border:.4cqw solid rgba(0,0,0,.25);border-radius:.5cqw;background:rgba(255,255,255,.05)}
#door:before{top:8%}#door:after{top:52%}
#knob{position:absolute;right:10%;top:52%;width:1.5cqw;height:1.5cqw;border-radius:50%;background:radial-gradient(#ffe38a,#b8860b);z-index:2}
#fp{position:absolute;left:36%;width:30%;top:28%;height:36%}
#mantel{position:absolute;left:-5%;right:-5%;top:0;height:9%;background:linear-gradient(#a06a3c,#7a4a2a);border-radius:.8cqw;box-shadow:0 .8cqw 1.5cqw rgba(0,0,0,.4)}
#stone{position:absolute;left:0;right:0;top:9%;bottom:0;background:#9a8f85;background-image:radial-gradient(circle at 20% 30%,#b3a89d 0 2cqw,transparent 2.2cqw),radial-gradient(circle at 70% 60%,#7f756c 0 2.4cqw,transparent 2.6cqw),radial-gradient(circle at 45% 85%,#b3a89d 0 1.8cqw,transparent 2cqw);background-size:6cqw 6cqw;border-radius:1cqw 1cqw 0 0}
#hole{position:absolute;left:18%;right:18%;top:30%;bottom:0;background:radial-gradient(ellipse at 50% 100%,#6b2400,#150600 80%);border-radius:50% 50% 0 0/35% 35% 0 0;overflow:hidden;box-shadow:inset 0 0 2cqw #000}
.fl{position:absolute;bottom:14%;font-size:6.5cqw;line-height:1;transform-origin:50% 100%;animation:fl .7s infinite alternate ease-in-out;filter:drop-shadow(0 0 1cqw #ff7a00)}
@keyframes fl{0%{transform:scale(1,.9) rotate(-4deg)}50%{transform:scale(1.1,1.15) rotate(3deg)}100%{transform:scale(.95,1.05) rotate(-2deg)}}
.log{position:absolute;bottom:2%;font-size:4.4cqw;line-height:1}
#ctr{position:absolute;left:24%;right:3%;top:47%;height:17%;background:linear-gradient(#e8dcc6 0 14%,transparent 14%),repeating-linear-gradient(90deg,#b98a5a 0 9cqw,#7a5230 9cqw 9.4cqw);border-radius:.6cqw .6cqw 0 0;box-shadow:0 0 1.5cqw rgba(0,0,0,.3)}
#fence{position:absolute;left:0;right:0;top:46%;height:18%;background:repeating-linear-gradient(90deg,#fff 0 2.2cqw,transparent 2.2cqw 3.4cqw)}
#fence:before,#fence:after{content:"";position:absolute;left:0;right:0;height:1.2cqw;background:#e8dcc6}
#fence:before{top:25%}#fence:after{top:65%}
.hill{position:absolute;border-radius:50%}
.cl{position:absolute;font-size:8cqw;line-height:1;animation:drift 40s linear infinite alternate}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(9cqw)}}
.it{position:absolute;transform:translate(-50%,-100%);line-height:1;cursor:grab;filter:drop-shadow(.4cqw .6cqw .4cqw rgba(0,0,0,.35))}
.it.sel{outline:.5cqw dashed #fff;outline-offset:.4cqw;border-radius:1cqw}
.rug{border-radius:50%;box-shadow:inset 0 0 0 1cqw rgba(255,255,255,.35),inset 0 0 0 1.6cqw rgba(0,0,0,.18)}
#bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;margin:8px 0;min-height:40px}
button{font:inherit;cursor:pointer;border:2px solid #5b3a24;background:var(--card);color:var(--ink);border-radius:12px;padding:6px 10px;font-size:18px}
button:active{transform:scale(.94)}
.sw{width:30px;height:30px;border-radius:50%;padding:0;border:3px solid #fff;box-shadow:0 0 0 2px #5b3a24}
.lbl{font-size:13px;font-weight:bold}
#rooms,#tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
#rooms{margin-bottom:6px}
#rooms button{white-space:nowrap;font-size:16px}
#rooms button.on{background:#7bbf5a;color:#16300c}
#tabs button{white-space:nowrap;font-size:15px}
#tabs button.on{background:#e9a24b;color:#3b2112}
#pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;background:var(--card);padding:8px;border-radius:14px;max-height:230px;overflow-y:auto}
#pal button{font-size:34px;padding:4px;line-height:1.1}
#pal button span{display:block;font-size:11px;font-weight:bold}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;margin:4px 0}
</style></head><body>
<h1>🏡 My Cozy House</h1>
<div id="wrap">
<div id="rooms"></div>
<div id="room">
 <div id="wall"></div><div id="skirt"></div><div id="floor"></div>
 <div id="scene"></div>
 <div id="items"></div>
 <div id="glow"></div>
</div>
<div id="bar"></div>
<div class="row"><span class="lbl" id="wl">Walls:</span><span id="wsw"></span></div>
<div class="row"><span class="lbl" id="fl2">Floor:</span><span id="fsw"></span><button id="snd" title="Narrator on/off">🔊</button><button id="clr" title="Clear this room">🧹</button></div>
<div id="tabs"></div>
<div id="pal"></div>
</div>
<script>
const $=s=>document.querySelector(s),room=$("#room"),box=$("#items");
const WALLS=["#e9b8a0","#f6e2a0","#a9d6c4","#a8c8ec","#e3b0d6","#f4f1e8","#c9a4e8","#f5a9a0","#9cc77a","#e8946b"];
const FLOORS=["#b9854f","#d9b98a","#7a5030","#a8a8a0","#c9645a","#6f8f6a"];
const HUES=[["none","#bbb"],["hue-rotate(60deg)","#8bc34a"],["hue-rotate(150deg)","#26c6da"],["hue-rotate(210deg)","#5c6bc0"],["hue-rotate(290deg)","#ec407a"],["hue-rotate(-40deg) saturate(1.6)","#ff9800"],["grayscale(1) brightness(1.2)","#999"],["sepia(1) saturate(1.5)","#b0793a"]];
const rugs=[["rug:#c0504d","red rug"],["rug:#4a7fb5","blue rug"],["rug:#e0b84a","yellow rug"],["rug:#6aa56a","green rug"],["rug:#a56ab5","purple rug"],["rug:#f2f2f2","white rug"]];
// category: [size, items]
const CATS={
"Furniture":[13,[["🛋️","sofa"],["🪑","chair"],["🛏️","bed"],["🗄️","cabinet"],["🪞","mirror"],["🚪","little door"],["🧺","basket"],["📺","television"],["🖥️","computer"],["🗑️","bin"]]],
"Cosy":[6,[["🕯️","candle"],["🧸","teddy bear"],["🧶","ball of wool"],["📚","pile of books"],["☕","cup of tea"],["🫖","teapot"],["🧦","warm socks"],["🪔","oil lamp"],["💡","light bulb"],["🍪","cookies"],["🍫","hot chocolate"],["🧣","scarf"],["🧤","gloves"]]],
"Pictures":[6,[["🖼️","picture"],["🕰️","clock"],["🎀","ribbon"],["🌈","rainbow"],["⭐","star"],["❤️","heart"],["🎈","balloon"],["🪅","piñata"],["🏆","trophy"],["🎁","present"],["🎄","Christmas tree"],["🔔","bell"]]],
"Plants":[8,[["🪴","pot plant"],["🌵","cactus"],["🌷","tulip"],["🌻","sunflower"],["💐","bunch of flowers"],["🌹","rose"],["🌲","little tree"],["🍄","toadstool"],["🌿","leafy plant"]]],
"Pets":[7,[["🐱","cat"],["🐶","dog"],["🐰","bunny"],["🐹","hamster"],["🐠","fish"],["🐢","tortoise"],["🦜","parrot"],["🐻","bear"],["🦆","duck"]]],
"Toys":[7,[["🚂","train"],["🎹","piano"],["🎸","guitar"],["🥁","drum"],["⚽","football"],["🧩","jigsaw"],["🪁","kite"],["🎨","paints"],["🚗","toy car"],["🪀","yo-yo"],["🎲","dice"],["🤖","robot"],["🦄","unicorn"],["🦖","dinosaur"],["🛴","scooter"]]],
"Rugs":[22,rugs],
"Bedroom":[13,[["🛏️","bed"],["🗄️","wardrobe"],["🪞","mirror"],["🪑","chair"],["🪔","bedside lamp"],["⏰","alarm clock"],["🛌","sleepy bed"],["🧸","teddy bear"],["📖","bedtime book"],["🌙","moon"],["💤","sleepy zzz"],["🧺","toy basket"]]],
"Clothes":[5,[["👗","dress"],["👕","t-shirt"],["👖","trousers"],["👟","trainers"],["🧢","cap"],["🩴","slippers"],["🧦","socks"],["🧥","coat"],["👒","sun hat"],["🎒","school bag"],["🧣","scarf"],["🧤","gloves"]]],
"Bathroom":[12,[["🚽","toilet"],["🛁","bath"],["🚿","shower"],["🚰","sink tap"],["🪞","mirror"],["🧺","laundry basket"],["🗑️","bin"],["🪣","bucket"],["🪠","plunger"]]],
"Washing":[5,[["🧼","soap"],["🪥","toothbrush"],["🧴","shampoo"],["🧻","toilet roll"],["🧽","sponge"],["🫧","bubbles"],["🦆","rubber duck"],["🪒","comb"],["🧹","brush"]]],
"Kitchen":[10,[["🧊","fridge"],["🍳","frying pan"],["🍲","cooking pot"],["🫖","teapot"],["🥣","bowl"],["🍽️","plate"],["🍴","knife and fork"],["🥄","spoon"],["🚰","tap"],["🗑️","bin"],["🪑","chair"],["🕰️","clock"],["⏲️","timer"],["🧂","salt"]]],
"Food":[5,[["🍎","apple"],["🍌","banana"],["🍇","grapes"],["🍓","strawberry"],["🍊","orange"],["🥕","carrot"],["🥦","broccoli"],["🍞","bread"],["🧀","cheese"],["🥚","egg"],["🍕","pizza"],["🧁","cupcake"],["🍪","cookie"],["🍰","cake"],["🍉","watermelon"],["🥛","milk"],["🧃","juice"],["☕","cup of tea"]]],
"Garden":[11,[["🪑","garden bench"],["🛖","shed"],["🏡","playhouse"],["⛲","fountain"],["⛱️","parasol"],["🪣","bucket"],["🪜","ladder"],["🚲","bicycle"],["🧺","basket"],["🍖","barbecue"],["🛝","slide"],["🏺","flower pot"],["🪁","kite"]]],
"Flowers":[6,[["🌷","tulip"],["🌻","sunflower"],["🌹","rose"],["🌼","daisy"],["🌸","blossom"],["🌺","hibiscus"],["💐","bunch of flowers"],["🌱","seedling"],["🌿","leafy plant"],["🍀","clover"],["🌾","long grass"],["🍄","toadstool"]]],
"Trees":[16,[["🌳","big tree"],["🌲","pine tree"],["🌴","palm tree"],["🌵","cactus"],["🎄","Christmas tree"],["🪴","pot plant"]]],
"Play":[8,[["🛝","slide"],["⚽","football"],["🏀","basketball"],["🛴","scooter"],["🚲","bicycle"],["🪁","kite"],["🎈","balloon"],["🪀","yo-yo"],["🧸","teddy bear"],["rug:#c0504d","picnic blanket"]]],
"Bugs":[3.5,[["🐝","bee"],["🦋","butterfly"],["🐌","snail"],["🐞","ladybird"],["🐛","caterpillar"],["🐜","ant"]]],
"Garden pets":[8,[["🐶","dog"],["🐱","cat"],["🐰","bunny"],["🐔","chicken"],["🐓","cockerel"],["🐿️","squirrel"],["🦔","hedgehog"],["🐸","frog"],["🐢","tortoise"],["🦆","duck"]]],
"Sky":[9,[["☀️","sun"],["☁️","cloud"],["🌈","rainbow"],["🐦","bird"],["🪁","kite"],["🎈","balloon"],["🌙","moon"],["⭐","star"]]]
};
const win=(l,w,c,ic)=>`<div class="win ${c||""}" style="left:${l}%;width:${w}%">${ic||""}</div>`;
const SC={
living:`<div id="door"><div id="knob"></div></div>
<div class="win" style="left:19%"><i style="left:12%;top:8%">⭐</i><i style="left:62%;top:20%">🌙</i><i style="left:30%;top:50%">✨</i></div>
<div class="curt" style="left:17%"></div><div class="curt" style="left:34%;width:3cqw"></div>
<div class="win" style="left:70%"><i style="left:18%;top:10%">✨</i><i style="left:65%;top:42%">⭐</i></div>
<div class="curt" style="left:68%"></div><div class="curt" style="left:85%;width:3cqw"></div>
<div id="fp"><div id="mantel"></div><div id="stone"></div><div id="hole"><span class="log" style="left:14%">🪵</span><span class="log" style="left:44%">🪵</span><span class="fl" style="left:8%;animation-delay:-.2s">🔥</span><span class="fl" style="left:30%;font-size:8cqw">🔥</span><span class="fl" style="left:50%;animation-delay:-.4s">🔥</span><span class="fl" style="left:20%;font-size:5cqw;animation-delay:-.5s">🔥</span></div></div>`,
bed:`<div id="door"><div id="knob"></div></div>
${win(38,24,"",'<i style="left:12%;top:8%">⭐</i><i style="left:70%;top:20%">🌙</i><i style="left:40%;top:55%">✨</i>')}
<div class="curt" style="left:36%"></div><div class="curt" style="left:60%;width:3cqw"></div>`,
bath:`<div id="door"><div id="knob"></div></div>
${win(66,15,"frost")}<div class="curt" style="left:64%;background:linear-gradient(90deg,#5aa9d6,#8cc9ea,#5aa9d6)"></div>`,
kit:`<div id="door"><div id="knob"></div></div>
${win(50,18,"day",'<i style="left:15%;top:15%">☁️</i>')}<div id="ctr"></div>`,
garden:`<div style="position:absolute;inset:0 0 38% 0;overflow:hidden"><div class="hill" style="left:-10%;top:50%;width:60%;height:100%;background:#7bbf5a"></div><div class="hill" style="left:40%;top:56%;width:70%;height:100%;background:#62a84a"></div></div>
<div style="position:absolute;left:8%;top:5%;font-size:9cqw;line-height:1">☀️</div>
<div class="cl" style="left:35%;top:6%">☁️</div><div class="cl" style="left:65%;top:14%;font-size:6cqw;animation-delay:-12s">☁️</div><div id="fence"></div>`
};
const SKY=["#8fd0ff","#bfe6ff","#ffcf9a","#f7a8b8","#3a4f8f","#10204a"],GRASS=["#6fb24a","#4f9a3c","#9ccc65","#c9b27a","#a8a8a0","#d9b98a"];
const ROOMS={
living:{n:"Living Room",ic:"🛋️",cls:"r-liv",w:WALLS,f:FLOORS,dw:"#e9b8a0",df:"#b9854f",glow:1,ymin:20,tabs:["Furniture","Cosy","Pictures","Plants","Pets","Toys","Rugs"]},
bed:{n:"Bedroom",ic:"🛏️",cls:"r-bed",w:WALLS,f:FLOORS,dw:"#a8c8ec",df:"#d9b98a",ymin:20,tabs:["Bedroom","Clothes","Cosy","Toys","Pictures","Pets","Rugs"]},
bath:{n:"Bathroom",ic:"🛁",cls:"r-bath",w:["#bfe6ef","#ffffff","#f6d6e0","#d8f0c8","#fff3b8","#c9d6f5"],f:["#e8e8e8","#9fc5d6","#c9a07a","#6f8f6a","#d9b9c9","#555555"],dw:"#bfe6ef",df:"#e8e8e8",ymin:20,tabs:["Bathroom","Washing","Pictures","Plants","Rugs"]},
kit:{n:"Kitchen",ic:"🍳",cls:"r-kit",w:["#fff3b8","#f6c7a0","#c8e6c9","#bfe0f5","#f8f8f8","#e8b0b0"],f:FLOORS,dw:"#fff3b8",df:"#d9b98a",ymin:20,tabs:["Kitchen","Food","Plants","Pets","Rugs"]},
garden:{n:"Garden",ic:"🌳",cls:"r-garden",w:SKY,f:GRASS,dw:"#8fd0ff",df:"#6fb24a",ymin:14,sky:1,tabs:["Garden","Flowers","Trees","Play","Bugs","Garden pets","Sky"]}
};
const S={};Object.keys(ROOMS).forEach(k=>S[k]={items:[],wall:ROOMS[k].dw,floor:ROOMS[k].df});
let cur="living",sel=null,uid=0,voice=true,tab="Furniture";
const R=()=>S[cur],C=()=>ROOMS[cur];
const praise=["Lovely!","How cosy!","Nice choice!","Looks great!","Wonderful!","So pretty!"];
function say(t){if(!voice||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=.9;u.pitch=1.15;speechSynthesis.speak(u)}catch(e){}}
function mk(arr,el,fn){arr.forEach(c=>{const b=document.createElement("button");b.className="sw";b.style.background=c;b.onclick=()=>fn(c);el.appendChild(b)})}
$("#snd").onclick=e=>{voice=!voice;e.target.textContent=voice?"🔊":"🔇"};
$("#clr").onclick=()=>{R().items=[];sel=null;draw();say("All tidy! Let's start again.")};
function rooms(){const t=$("#rooms");t.innerHTML="";Object.keys(ROOMS).forEach(k=>{const b=document.createElement("button");b.textContent=ROOMS[k].ic+" "+ROOMS[k].n;if(k===cur)b.className="on";b.onclick=()=>setRoom(k);t.appendChild(b)})}
function setRoom(k,quiet){cur=k;const c=C(),s=R();room.className=c.cls;$("#scene").innerHTML=SC[k];$("#glow").style.display=c.glow?"":"none";
 room.style.setProperty("--wall",s.wall);room.style.setProperty("--floor",s.floor);
 $("#wl").textContent=c.sky?"Sky:":"Walls:";$("#fl2").textContent=c.sky?"Grass:":"Floor:";
 $("#wsw").innerHTML="";$("#fsw").innerHTML="";
 mk(c.w,$("#wsw"),x=>{s.wall=x;room.style.setProperty("--wall",x);say(c.sky?"A new sky!":"A new colour for the walls!")});
 mk(c.f,$("#fsw"),x=>{s.floor=x;room.style.setProperty("--floor",x);say(c.sky?"New grass!":"A new floor!")});
 sel=null;tab=c.tabs[0];rooms();tabs();pal();draw();if(!quiet)say("Welcome to the "+c.n+"!")}
function tabs(){const t=$("#tabs");t.innerHTML="";C().tabs.forEach(k=>{const b=document.createElement("button");b.textContent=k;if(k===tab)b.className="on";b.onclick=()=>{tab=k;tabs();pal()};t.appendChild(b)})}
function pal(){const p=$("#pal");p.innerHTML="";CATS[tab][1].forEach(([e,n])=>{const b=document.createElement("button");b.innerHTML=(e.startsWith("rug:")?'<div class="rug" style="width:40px;height:26px;margin:4px auto;background:'+e.slice(4)+'"></div>':e)+"<span>"+n+"</span>";b.onclick=()=>add(e,n);p.appendChild(b)})}
function add(e,n){const rug=e.startsWith("rug:"),sky=tab==="Sky";const it={id:++uid,e,n,x:30+Math.random()*40,y:rug?92:sky?24+Math.random()*14:(cur==="garden"?66:70)+Math.random()*(cur==="garden"?30:22),s:rug?22:CATS[tab][0],f:"none",flip:1};R().items.push(it);sel=it.id;draw();say("A "+n+"! "+(Math.random()<.5?praise[Math.floor(Math.random()*praise.length)]:""))}
function draw(){const items=R().items;box.innerHTML="";items.forEach(it=>{const d=document.createElement("div");d.className="it"+(it.id===sel?" sel":"");d.style.left=it.x+"%";d.style.top=it.y+"%";d.style.zIndex=it.e.startsWith("rug:")?1:Math.round(it.y*10)+10;d.style.fontSize=it.s+"cqw";d.style.filter=(it.f==="none"?"":it.f+" ")+"drop-shadow(.4cqw .6cqw .4cqw rgba(0,0,0,.35))";
 if(it.e.startsWith("rug:")){d.className+=" rug";d.style.width=it.s+"cqw";d.style.height=it.s*.4+"cqw";d.style.background=it.e.slice(4);d.style.transform="translate(-50%,-50%)";d.style.filter=it.f==="none"?"none":it.f}else{d.textContent=it.e;d.style.transform="translate(-50%,-100%) scaleX("+it.flip+")"}
 d.onpointerdown=ev=>drag(ev,it);box.appendChild(d)});bar()}
function bar(){const b=$("#bar");b.innerHTML="";const it=R().items.find(i=>i.id===sel);if(!it){b.innerHTML='<span class="lbl">Tap something below to put it in the room, then drag it around! 👆</span>';return}
 const B=(t,f)=>{const x=document.createElement("button");x.textContent=t;x.onclick=f;b.appendChild(x)};
 B("➖",()=>{it.s=Math.max(2,it.s*.85);draw()});B("➕",()=>{it.s=Math.min(60,it.s*1.18);draw()});B("↔️",()=>{it.flip*=-1;draw()});
 const l=document.createElement("span");l.className="lbl";l.textContent="Paint:";b.appendChild(l);
 HUES.forEach(h=>{const s=document.createElement("button");s.className="sw";s.style.background=h[1];s.onclick=()=>{it.f=h[0];draw();say("Painted!")};b.appendChild(s)});
 B("🗑️",()=>{R().items=R().items.filter(i=>i!==it);sel=null;draw();say("Bye bye "+it.n)})}
function drag(ev,it){ev.preventDefault();sel=it.id;const r=room.getBoundingClientRect(),ym=C().ymin,items=R().items;const mv=e=>{it.x=Math.min(98,Math.max(2,(e.clientX-r.left)/r.width*100));it.y=Math.min(99,Math.max(ym,(e.clientY-r.top)/r.height*100));const el=[...box.children][items.indexOf(it)];if(el){el.style.left=it.x+"%";el.style.top=it.y+"%";if(!it.e.startsWith("rug:"))el.style.zIndex=Math.round(it.y*10)+10}};
 const up=()=>{removeEventListener("pointermove",mv);removeEventListener("pointerup",up);draw()};addEventListener("pointermove",mv);addEventListener("pointerup",up);draw()}
room.addEventListener("pointerdown",e=>{if(!e.target.closest(".it")){sel=null;draw()}});
setRoom("living",true);
</script></body></html>
