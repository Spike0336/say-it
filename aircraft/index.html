<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#222;--accent:#2e7d5b;--bad:#c0562b}
@media(prefers-color-scheme:dark){:root{--bg:#181a19;--card:#242826;--ink:#eee}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px}
header{width:100%;max-width:560px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:1.3rem;margin:4px 0}
#stars{font-size:1.2rem;font-weight:700}
.card{width:100%;max-width:560px;background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 4px 16px #0003;margin-top:8px}
#photo{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#8885}
#msg{min-height:3.2em;text-align:center;font-size:1.25rem;padding:10px 12px;font-weight:600}
#bar{height:12px;background:#8883;margin:0 14px;border-radius:8px;overflow:hidden}#fill{display:block;height:100%;width:100%;background:var(--accent)}
.row{display:flex;gap:10px;justify-content:center;padding:6px 12px 16px;flex-wrap:wrap}
button{font:inherit;border:0;border-radius:40px;padding:12px 20px;background:#8883;color:var(--ink);cursor:pointer}
#mic{background:var(--accent);color:#fff;font-size:1.3rem;padding:16px 34px}
#mic.on{background:var(--bad);animation:p 1s infinite}
@keyframes p{50%{transform:scale(1.07)}}
#typed{display:none;gap:6px;padding:0 12px 12px}
#typed input{flex:1;font:inherit;padding:10px;border-radius:10px;border:1px solid #8886}
canvas{position:fixed;inset:0;pointer-events:none}
body{background:linear-gradient(160deg,#fff3c4,#d9f2e6 55%,#cfe8ff)}
@media(prefers-color-scheme:dark){body{background:linear-gradient(160deg,#2a2540,#1c2f2b)}}
.card{border:4px solid #fff8;border-radius:26px}
#msg{font-size:1.35rem}#bar{height:16px}
#fill{transition:background .3s}#fill.low{background:#e8a200}#fill.vlow{background:#d9442b}
.pop{animation:pop .7s}@keyframes pop{30%{transform:scale(1.06) rotate(-1.5deg)}60%{transform:scale(1.03) rotate(1.5deg)}}
.shake{animation:shake .5s}@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
button:active{transform:scale(.95)}#streak{font-size:1rem}
#photo{display:none}.playing #photo{display:block}
#cover{text-align:center;padding-bottom:6px}.playing #cover{display:none}
#cover svg{width:100%;display:block;aspect-ratio:4/3}
#cover h2{margin:8px 0 2px;font-size:1.6rem}#cover p{margin:0;padding:0 12px}
.bob{animation:bob 2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-7px)}}
#learnui{display:none;text-align:center}.learning #learnui{display:block}
#lname{font-size:2rem;font-weight:800;margin:6px 0 0;padding:0 10px}#lcount{opacity:.7;font-size:.95rem}
.learning #photo{display:block}
.learning #cover,.learning #bar,.learning #row1,.learning #row2,.learning #typed{display:none!important}
.playing #learn{display:none}
#learn{background:#ff9f1c;color:#fff;font-size:1.2rem;padding:16px 26px}
#ltest{background:var(--accent);color:#fff}
.homenav{width:100%;max-width:560px}
a.home{display:inline-block;background:#fffc;color:#1b5e45;text-decoration:none;font-weight:700;padding:8px 16px;border-radius:30px;box-shadow:0 2px 6px #0002;margin-bottom:4px}
@media(prefers-color-scheme:dark){a.home{background:#ffffff22;color:#cfeee0}}
</style>

<h2>Take Off! ✈️</h2><p>Learn them all first, then test yourself and win stars!</p></div>
  <img id="photo" alt="">

<canvas id="cv"></canvas>
<script>
// Display name | wikipedia title | accepted alternatives (comma separated)
const BREEDS = `Airliner|Airliner|passenger jet,passenger plane,jet liner,aeroplane,airplane
Jumbo Jet|Boeing_747|boeing 747,747
Airbus A380|Airbus_A380|a380,double decker plane
Concorde|Concorde|
Spitfire|Supermarine_Spitfire|supermarine spitfire
Lancaster Bomber|Avro_Lancaster|lancaster
Wright Flyer|Wright_Flyer|wright brothers plane
Biplane|Biplane|
Light Aircraft|Cessna_172|cessna
Microlight|Ultralight_aviation|ultralight
Seaplane|Seaplane|float plane,floatplane
Crop Duster|Agricultural_aircraft|crop sprayer
Water Bomber|Aerial_firefighting|firefighting plane,fire fighting plane
Fighter Jet|Fighter_aircraft|fighter plane
Jump Jet|Harrier_Jump_Jet|harrier
Red Arrows|Red_Arrows|
Stealth Bomber|Northrop_Grumman_B-2_Spirit|b2,b-2
Glider|Glider_(sailplane)|sailplane
Hang Glider|Hang_gliding|hang gliding
Paraglider|Paragliding|paragliding
Hot Air Balloon|Hot_air_balloon|balloon
Airship|Airship|blimp,zeppelin
Helicopter|Helicopter|chopper
Chinook|Boeing_CH-47_Chinook|chinook helicopter
Autogyro|Autogyro|gyrocopter,gyroplane
Tiltrotor|Bell_Boeing_V-22_Osprey|osprey,v22
Drone|Unmanned_aerial_vehicle|quadcopter,uav
Jetpack|Jet_pack|jet pack
Space Shuttle|Space_Shuttle|shuttle
Rocket|Rocket|
Flying Car|Flying_car|flying cars
Terrafugia Transition|Terrafugia_Transition|terrafugia
AeroMobil|AeroMobil|aero mobil
PAL-V Liberty|PAL-V_Liberty|pal v,palv,pal-v
Moller Skycar|Moller_Skycar_M400|skycar,sky car
Volocopter|Volocopter|volo copter
EHang 216|EHang_216|ehang,e hang
eVTOL|EVTOL|e vtol,ee vtol,air taxi,electric vertical takeoff and landing`.split('\n').map(l=>{const[n,w,a]=l.split('|');return{name:n,wiki:w,acc:[n,...(a?a.split(','):[])].map(norm)}});

function norm(s){return s.toLowerCase().replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim()}
function lev(a,b){const d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return d[b.length]}
function matches(heard,breed){
  const t=norm(heard).split(' ');
  return breed.acc.some(a=>{
    const aw=a.split(' ').length;
    for(let i=0;i+aw<=t.length;i++){
      const w=t.slice(i,i+aw).join(' ');
      if(w===a||lev(w,a)<=Math.floor(a.replace(/ /g,'').length/6))return true;
    }
    return false;
  });
}

const $=id=>document.getElementById(id);
const art=n=>/^[AEIOU]/i.test(n)?'an ':'a ';
let queue=[],cur=null,stars=0,misses=0,busy=false,listening=false;

// ---- Narrator (British English voice from the browser) ----
let voice=null;
function pickVoice(){const v=speechSynthesis.getVoices();voice=v.find(x=>/en-GB/i.test(x.lang)&&/female|google|serena|kate|libby|sonia/i.test(x.name))||v.find(x=>/en-GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(text){return new Promise(res=>{if(!('speechSynthesis' in window))return res();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);if(voice)u.voice=voice;u.lang='en-GB';u.rate=.95;u.pitch=1.05;u.onend=res;u.onerror=res;speechSynthesis.speak(u)})}

// ---- Fanfare ----
let ac;
function fanfare(){
  ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();
  const seq=[[523,0],[659,.12],[784,.24],[1047,.36],[784,.52],[1047,.64],[1319,.78]];
  seq.forEach(([f,t],i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=i>4?'square':'triangle';o.frequency.value=f;o.connect(g);g.connect(ac.destination);const s=ac.currentTime+t;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.25,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+(i===6?.9:.3));o.start(s);o.stop(s+1)});
  confetti();
}
function confetti(){
  const c=$('cv'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const P=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:4+Math.random()*6,h:Math.random()*360}));
  let n=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;x.fillStyle=`hsl(${p.h},90%,55%)`;x.fillRect(p.x,p.y,p.r,p.r*1.6)});if(++n<150)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})();
}

// ---- Photos from Wikipedia (loaded live, so needs internet) ----
function loadImg(u){return new Promise(r=>{const i=new Image();i.onload=()=>r(true);i.onerror=()=>r(false);i.src=u})}
async function getPhoto(b){
  if(b.url!==undefined)return b.url;
  b.url=null;
  try{
    const r=await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+b.wiki);
    const j=await r.json();
    const t=j.thumbnail&&j.thumbnail.source;
    if(t){
      const big=t.replace(/\/\d+px-/,'/500px-');
      const w=(j.originalimage&&j.originalimage.width)||0;
      if(w>=500&&await loadImg(big))b.url=big;
      else if(await loadImg(t))b.url=t;
    }
  }catch(e){}
  return b.url;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

const LIMIT=10000;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let running=false,resolved=true,timer=null,rec=null;

let barT=[];
function setBar(on){
  barT.forEach(clearTimeout);barT=[];
  const f=$('fill');f.className='';f.style.transition='none';f.style.width='100%';f.offsetWidth;
  if(on){f.style.transition='width '+LIMIT+'ms linear';f.style.width='0%';barT=[setTimeout(()=>f.className='low',LIMIT*.5),setTimeout(()=>f.className='vlow',LIMIT*.75)]}
}
function setMic(){const m=$('mic');m.textContent=running?'⏹ Stop':'🎯 Test me';m.classList.toggle('on',running)}
function stopRec(){if(rec){const r=rec;rec=null;try{r.abort()}catch(e){}}}

async function next(){
  resolved=true;clearTimeout(timer);stopRec();setBar(false);
  if(!queue.length)queue=shuffle([...BREEDS]);
  $('msg').textContent='Preparing for take-off… 🛫';
  let b,u;
  for(let i=0;i<8;i++){b=queue.pop();if(!b){queue=shuffle([...BREEDS]);b=queue.pop()}u=await getPhoto(b);if(u)break}
  if(!u){$('msg').textContent='Could not load photos — check your internet connection.';running=false;setMic();return}
  cur=b;
  await new Promise(r=>{const im=$('photo');im.onload=r;im.onerror=r;im.src=u});
  if(!running)return;
  document.body.classList.add('playing');
  $('msg').textContent='What aircraft is this? Say it out loud! ✈️';
  resolved=false;setBar(true);startRec();
  timer=setTimeout(()=>finish(false,'time'),LIMIT);
}

const PRAISE=['Brilliant!','Fantastic!','You got it!','Super!','Well done!','Amazing!','Spot on!','Wonderful!'];
const OOPS=['Good try!','Nearly!','Not this time!','Ooh, a tricky one!','Don\'t worry!'];
const TIMEUP=['Time\'s up!','Oh, time ran out!','Tick tock, time\'s up!'];
const pick=a=>a[Math.floor(Math.random()*a.length)];
let streak=0;
function anim(el,c){el.classList.remove(c);el.offsetWidth;el.classList.add(c)}
async function finish(ok,why,heard){
  if(resolved)return;
  resolved=true;clearTimeout(timer);stopRec();setBar(false);
  const nm=art(cur.name)+cur.name;
  if(ok){
    stars++;streak++;
    $('stars').textContent='⭐ '+stars;$('streak').textContent=streak>=2?'🔥 '+streak:'';
    anim(document.querySelector('.card'),'pop');fanfare();
    let line=pick(PRAISE)+' That is '+nm+'.';
    if(streak>=3)line+=' '+streak+' in a row!';
    if(stars%5===0)line+=' You are a superstar!';
    $('msg').textContent='🎉 '+line;
    await say(line);
  }else{
    streak=0;$('streak').textContent='';
    anim($('photo'),'shake');
    const t=why==='time',lead=t?pick(TIMEUP):pick(OOPS);
    $('msg').textContent=(t?'⏰ ':'🤔 ')+lead+' It\'s '+nm+'.'+(heard?` (I heard "${heard}")`:'');
    await say(lead+' That is '+nm+'. On to the next one!');
  }
  if(running)next();
}

function startRec(){
  if(!SR)return;
  stopRec();
  const r=new SR();rec=r;
  r.lang='en-GB';r.continuous=true;r.interimResults=true;r.maxAlternatives=5;
  r.onresult=e=>{
    if(resolved)return;
    const res=e.results[e.results.length-1];
    const alts=[...res].map(a=>a.transcript);
    if(alts.some(h=>matches(h,cur)))finish(true);
    else if(res.isFinal)finish(false,'wrong',alts[0]);
  };
  r.onerror=e=>{
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){
      running=false;resolved=true;clearTimeout(timer);setBar(false);setMic();
      $('msg').textContent='Microphone blocked — allow it in the browser\'s site settings, then tap Test me.';
    }
  };
  r.onend=()=>{if(!resolved&&running&&rec===r){try{r.start()}catch(e){}}};
  try{r.start()}catch(e){}
}

if(!SR){$('typed').style.display='flex';$('msg').textContent='Speech recognition isn\'t supported in this browser — you can type the aircraft instead (Chrome supports the microphone). Tap Test me.'}
$('mic').onclick=async()=>{
  if(running){
    running=false;resolved=true;clearTimeout(timer);stopRec();speechSynthesis.cancel();setBar(false);setMic();document.body.classList.remove('playing');
    $('msg').textContent='Great playing! You scored '+stars+' ⭐ Tap Test me to play again.';
    say('Great playing! You got '+stars+(stars===1?' star.':' stars.'));return;
  }
  running=true;setMic();streak=0;
  ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();
  $('msg').textContent='Hello! Let\'s play! 🎉';
  await say('Hello! Let\'s play! You have ten seconds for each one. Good luck!');
  if(running)next();
};
$('tgo').onclick=()=>{const v=$('tin').value;$('tin').value='';if(!v||!running||resolved)return;matches(v,cur)?finish(true):finish(false,'wrong',v)};
$('tin').onkeydown=e=>{if(e.key==='Enter')$('tgo').click()};
$('skip').onclick=()=>{if(running&&!resolved){resolved=true;clearTimeout(timer);stopRec();next()}};

// ---- Learn mode: see every answer first ----
const TINY='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
let learning=false,li=0,auto=false,autoTok=0;
async function showLearn(){
  const b=BREEDS[li];
  $('lcount').textContent=(li+1)+' of '+BREEDS.length;
  $('lname').textContent=b.name;
  const u=await getPhoto(b);
  if(!learning||BREEDS[li]!==b)return;
  $('photo').src=u||TINY;
  await say('This is '+art(b.name)+b.name+'.');
}
function goLearn(d){li=(li+d+BREEDS.length)%BREEDS.length;return showLearn()}
async function autoLoop(tok){
  while(auto&&tok===autoTok&&learning){
    await new Promise(r=>setTimeout(r,1500));
    if(!auto||tok!==autoTok||!learning)return;
    await goLearn(1);
  }
}
function stopLearn(){
  learning=false;auto=false;autoTok++;speechSynthesis.cancel();
  document.body.classList.remove('learning');$('lauto').textContent='▶ Auto-play';
  $('msg').textContent='Tap 📖 Learn to meet them all first, then 🎯 Test me!';
}
$('learn').onclick=()=>{
  if(running)return;
  learning=true;li=0;document.body.classList.add('learning');
  $('msg').textContent='Listen, then say each one out loud! 🗣️';
  showLearn();
};
$('lprev').onclick=()=>goLearn(-1);
$('lnext').onclick=()=>goLearn(1);
$('lhear').onclick=()=>say('This is '+art(BREEDS[li].name)+BREEDS[li].name+'.');
$('lauto').onclick=()=>{
  auto=!auto;$('lauto').textContent=auto?'⏸ Pause':'▶ Auto-play';
  if(auto)autoLoop(++autoTok);else{autoTok++}
};
$('lclose').onclick=stopLearn;
$('ltest').onclick=()=>{stopLearn();$('mic').click()};
</script>
</body>
