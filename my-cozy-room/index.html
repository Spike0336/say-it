<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cozy Room</title>
<style>
:root{--bg:#fdf3e3;--ink:#4a3328;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1d17;--ink:#f6e6d2;--card:#3b2a21}}
:root[data-theme="dark"]{--bg:#2a1d17;--ink:#f6e6d2;--card:#3b2a21}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:8px}
h1{margin:4px 0;font-size:22px}
#wrap{width:100%;max-width:900px}
#room{position:relative;width:100%;aspect-ratio:16/10;container-type:inline-size;overflow:hidden;border-radius:14px;border:4px solid #5b3a24;touch-action:none;background:var(--wall,#e9b8a0)}
#wall{position:absolute;inset:0 0 38% 0;background:var(--wall,#e9b8a0);background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 2cqw,rgba(0,0,0,.04) 2cqw 4cqw);box-shadow:inset 0 -2cqw 4cqw rgba(0,0,0,.12)}
#floor{position:absolute;inset:62% 0 0 0;background:var(--floor,#b9854f);background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.12) 0 .4cqw,transparent .4cqw 9cqw),repeating-linear-gradient(0deg,rgba(0,0,0,.06) 0 .3cqw,transparent .3cqw 6cqw);box-shadow:inset 0 3cqw 4cqw rgba(0,0,0,.25)}
#skirt{position:absolute;left:0;right:0;top:60%;height:2.4%;background:#f4ead8;box-shadow:0 .3cqw .6cqw rgba(0,0,0,.3)}
#glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 62%,rgba(255,150,40,.38),rgba(255,120,20,.12) 40%,transparent 70%);animation:glow 2.4s infinite ease-in-out;mix-blend-mode:screen;z-index:9000}
@keyframes glow{0%,100%{opacity:.8}30%{opacity:1}60%{opacity:.65}}
.win{position:absolute;top:9%;width:17%;height:34%;background:linear-gradient(#10204a,#3a4f8f 60%,#f0a860);border:1cqw solid #f4ead8;border-radius:.6cqw;box-shadow:0 0 0 .4cqw #b79a78,inset 0 0 3cqw rgba(0,0,0,.4);overflow:hidden}
.win:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:.9cqw;margin-left:-.45cqw;background:#f4ead8}
.win:after{content:"";position:absolute;top:50%;left:0;right:0;height:.9cqw;margin-top:-.45cqw;background:#f4ead8}
.win i{position:absolute;font-style:normal;font-size:2cqw}
.curt{position:absolute;top:-1%;width:4cqw;height:40%;background:linear-gradient(90deg,#c0504d,#e07a76,#c0504d);border-radius:0 0 1cqw 1cqw;box-shadow:0 0 1cqw rgba(0,0,0,.3)}
#door{position:absolute;left:3%;top:10%;width:13%;height:54%;background:linear-gradient(90deg,#7a4a2a,#935b34,#7a4a2a);border:.9cqw solid #f4ead8;border-bottom:0;border-radius:1cqw 1cqw 0 0;box-shadow:0 0 1cqw rgba(0,0,0,.4)}
#door:before,#door:after{content:"";position:absolute;left:14%;width:72%;height:36%;border:.4cqw solid rgba(0,0,0,.25);border-radius:.5cqw;background:rgba(255,255,255,.05)}
#door:before{top:8%}#door:after{top:52%}
#knob{position:absolute;right:10%;top:52%;width:1.5cqw;height:1.5cqw;border-radius:50%;background:radial-gradient(#ffe38a,#b8860b);z-index:2}
#fp{position:absolute;left:36%;width:30%;top:28%;height:36%}
#mantel{position:absolute;left:-5%;right:-5%;top:0;height:9%;background:linear-gradient(#a06a3c,#7a4a2a);border-radius:.8cqw;box-shadow:0 .8cqw 1.5cqw rgba(0,0,0,.4)}
#stone{position:absolute;left:0;right:0;top:9%;bottom:0;background:#9a8f85;background-image:radial-gradient(circle at 20% 30%,#b3a89d 0 2cqw,transparent 2.2cqw),radial-gradient(circle at 70% 60%,#7f756c 0 2.4cqw,transparent 2.6cqw),radial-gradient(circle at 45% 85%,#b3a89d 0 1.8cqw,transparent 2cqw);background-size:6cqw 6cqw;border-radius:1cqw 1cqw 0 0}
#hole{position:absolute;left:18%;right:18%;top:30%;bottom:0;background:radial-gradient(ellipse at 50% 100%,#6b2400,#150600 80%);border-radius:50% 50% 0 0/35% 35% 0 0;overflow:hidden;box-shadow:inset 0 0 2cqw #000}
.fl{position:absolute;bottom:14%;font-size:6.5cqw;line-height:1;transform-origin:50% 100%;animation:fl .7s infinite alternate ease-in-out;filter:drop-shadow(0 0 1cqw #ff7a00)}
@keyframes fl{0%{transform:scale(1,.9) rotate(-4deg)}50%{transform:scale(1.1,1.15) rotate(3deg)}100%{transform:scale(.95,1.05) rotate(-2deg)}}
.log{position:absolute;bottom:2%;font-size:4.4cqw;line-height:1}
.it{position:absolute;transform:translate(-50%,-100%);line-height:1;cursor:grab;filter:drop-shadow(.4cqw .6cqw .4cqw rgba(0,0,0,.35))}
.it.sel{outline:.5cqw dashed #fff;outline-offset:.4cqw;border-radius:1cqw}
.rug{border-radius:50%;box-shadow:inset 0 0 0 1cqw rgba(255,255,255,.35),inset 0 0 0 1.6cqw rgba(0,0,0,.18)}
#bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;margin:8px 0;min-height:40px}
button{font:inherit;cursor:pointer;border:2px solid #5b3a24;background:var(--card);color:var(--ink);border-radius:12px;padding:6px 10px;font-size:18px}
button:active{transform:scale(.94)}
.sw{width:30px;height:30px;border-radius:50%;padding:0;border:3px solid #fff;box-shadow:0 0 0 2px #5b3a24}
.lbl{font-size:13px;font-weight:bold}
#tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
#tabs button{white-space:nowrap;font-size:15px}
#tabs button.on{background:#e9a24b;color:#3b2112}
#pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;background:var(--card);padding:8px;border-radius:14px;max-height:230px;overflow-y:auto}
#pal button{font-size:34px;padding:4px;line-height:1.1}
#pal button span{display:block;font-size:11px;font-weight:bold}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;margin:4px 0}
</style></head><body>
<h1>🏡 My Cozy Room</h1>
<div id="wrap">
<div id="room">
 <div id="wall"></div><div id="skirt"></div><div id="floor"></div>
 <div id="door"><div id="knob"></div></div>
 <div class="win" style="left:19%"><i style="left:12%;top:8%">⭐</i><i style="left:62%;top:20%">🌙</i><i style="left:30%;top:50%">✨</i></div>
 <div class="curt" style="left:17%"></div><div class="curt" style="left:34%;width:3cqw"></div>
 <div class="win" style="left:70%"><i style="left:18%;top:10%">✨</i><i style="left:65%;top:42%">⭐</i></div>
 <div class="curt" style="left:68%"></div><div class="curt" style="left:85%;width:3cqw"></div>
 <div id="fp"><div id="mantel"></div><div id="stone"></div>
  <div id="hole"><span class="log" style="left:14%">🪵</span><span class="log" style="left:44%">🪵</span>
  <span class="fl" style="left:8%;animation-delay:-.2s">🔥</span><span class="fl" style="left:30%;font-size:8cqw">🔥</span><span class="fl" style="left:50%;animation-delay:-.4s">🔥</span><span class="fl" style="left:20%;font-size:5cqw;animation-delay:-.5s">🔥</span></div></div>
 <div id="items"></div>
 <div id="glow"></div>
</div>
<div id="bar"></div>
<div class="row"><span class="lbl">Walls:</span><span id="wsw"></span></div>
<div class="row"><span class="lbl">Floor:</span><span id="fsw"></span><button id="snd" title="Narrator on/off">🔊</button><button id="clr" title="Clear room">🧹</button></div>
<div id="tabs"></div>
<div id="pal"></div>
</div>
<script>
const $=s=>document.querySelector(s),room=$("#room"),box=$("#items");
const WALLS=["#e9b8a0","#f6e2a0","#a9d6c4","#a8c8ec","#e3b0d6","#f4f1e8","#c9a4e8","#f5a9a0","#9cc77a","#e8946b"];
const FLOORS=["#b9854f","#d9b98a","#7a5030","#a8a8a0","#c9645a","#6f8f6a"];
const HUES=[["none","#bbb"],["hue-rotate(60deg)","#8bc34a"],["hue-rotate(150deg)","#26c6da"],["hue-rotate(210deg)","#5c6bc0"],["hue-rotate(290deg)","#ec407a"],["hue-rotate(-40deg) saturate(1.6)","#ff9800"],["grayscale(1) brightness(1.2)","#999"],["sepia(1) saturate(1.5)","#b0793a"]];
const CATS={
"Furniture":[["🛋️","sofa"],["🪑","chair"],["🛏️","bed"],["🗄️","cabinet"],["🪞","mirror"],["🚪","little door"],["🧺","basket"],["🛁","bath"],["🚽","toilet"],["📺","television"],["🖥️","computer"],["🧊","fridge"],["🗑️","bin"]],
"Cosy":[["🕯️","candle"],["🧸","teddy bear"],["🧶","ball of wool"],["📚","pile of books"],["☕","cup of tea"],["🫖","teapot"],["🧦","warm socks"],["🪔","oil lamp"],["💡","light bulb"],["🍪","cookies"],["🍫","hot chocolate"],["🛏","pillow"],["🧣","scarf"],["🧤","gloves"]],
"Pictures":[["🖼️","picture"],["🕰️","clock"],["🎀","ribbon"],["🌈","rainbow"],["⭐","star"],["❤️","heart"],["🎈","balloon"],["🪅","piñata"],["🏆","trophy"],["🎁","present"],["🎄","Christmas tree"],["🔔","bell"]],
"Plants":[["🪴","pot plant"],["🌵","cactus"],["🌷","tulip"],["🌻","sunflower"],["💐","bunch of flowers"],["🌹","rose"],["🌲","little tree"],["🍄","toadstool"],["🌿","leafy plant"]],
"Pets":[["🐱","cat"],["🐶","dog"],["🐰","bunny"],["🐹","hamster"],["🐠","fish"],["🐢","tortoise"],["🦜","parrot"],["🐻","bear"],["🦆","duck"]],
"Toys":[["🚂","train"],["🎹","piano"],["🎸","guitar"],["🥁","drum"],["⚽","football"],["🧩","jigsaw"],["🪁","kite"],["🎨","paints"],["🚗","toy car"],["🪀","yo-yo"],["🎲","dice"],["🤖","robot"],["🦄","unicorn"],["🦖","dinosaur"],["🛴","scooter"]],
"Rugs":[["rug:#c0504d","red rug"],["rug:#4a7fb5","blue rug"],["rug:#e0b84a","yellow rug"],["rug:#6aa56a","green rug"],["rug:#a56ab5","purple rug"],["rug:#f2f2f2","white rug"]]
};
const SIZE={"Furniture":13,"Cosy":6,"Pictures":6,"Plants":8,"Pets":7,"Toys":7,"Rugs":22};
let items=[],sel=null,uid=0,voice=true,tab="Furniture";
const praise=["Lovely!","How cosy!","Nice choice!","Looks great!","Wonderful!","So pretty!"];
function say(t){if(!voice||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=.9;u.pitch=1.15;speechSynthesis.speak(u)}catch(e){}}
function mk(arr,el,fn,cls){arr.forEach(c=>{const b=document.createElement("button");b.className="sw";b.style.background=Array.isArray(c)?c[1]:c;b.onclick=()=>fn(c);el.appendChild(b)})}
mk(WALLS,$("#wsw"),c=>{room.style.setProperty("--wall",c);say("A new colour for the walls!")});
mk(FLOORS,$("#fsw"),c=>{room.style.setProperty("--floor",c);say("A new floor!")});
$("#snd").onclick=e=>{voice=!voice;e.target.textContent=voice?"🔊":"🔇"};
$("#clr").onclick=()=>{items=[];sel=null;draw();say("All tidy! Let's start again.")};
function tabs(){const t=$("#tabs");t.innerHTML="";Object.keys(CATS).forEach(k=>{const b=document.createElement("button");b.textContent=k;if(k===tab)b.className="on";b.onclick=()=>{tab=k;tabs();pal()};t.appendChild(b)})}
function pal(){const p=$("#pal");p.innerHTML="";CATS[tab].forEach(([e,n])=>{const b=document.createElement("button");b.innerHTML=(e.startsWith("rug:")?'<div class="rug" style="width:40px;height:26px;margin:4px auto;background:'+e.slice(4)+'"></div>':e)+"<span>"+n+"</span>";b.onclick=()=>add(e,n);p.appendChild(b)})}
function add(e,n){const it={id:++uid,e,n,x:30+Math.random()*40,y:e.startsWith("rug:")?92:70+Math.random()*22,s:SIZE[tab],f:"none",flip:1};items.push(it);sel=it.id;draw();say("A "+n+"! "+(Math.random()<.5?praise[Math.floor(Math.random()*praise.length)]:""))}
function draw(){box.innerHTML="";items.forEach(it=>{const d=document.createElement("div");d.className="it"+(it.id===sel?" sel":"");d.style.left=it.x+"%";d.style.top=it.y+"%";d.style.zIndex=it.e.startsWith("rug:")?1:Math.round(it.y*10)+10;d.style.fontSize=it.s+"cqw";d.style.filter=(it.f==="none"?"":it.f+" ")+"drop-shadow(.4cqw .6cqw .4cqw rgba(0,0,0,.35))";
 if(it.e.startsWith("rug:")){d.className+=" rug";d.style.width=it.s+"cqw";d.style.height=it.s*.4+"cqw";d.style.background=it.e.slice(4);d.style.transform="translate(-50%,-50%)";d.style.filter=it.f==="none"?"none":it.f}else{d.textContent=it.e;d.style.transform="translate(-50%,-100%) scaleX("+it.flip+")"}
 d.onpointerdown=ev=>drag(ev,it);box.appendChild(d)});bar()}
function bar(){const b=$("#bar");b.innerHTML="";const it=items.find(i=>i.id===sel);if(!it){b.innerHTML='<span class="lbl">Tap something below to put it in the room, then drag it around! 👆</span>';return}
 const B=(t,f)=>{const x=document.createElement("button");x.textContent=t;x.onclick=f;b.appendChild(x)};
 B("➖",()=>{it.s=Math.max(2,it.s*.85);draw()});B("➕",()=>{it.s=Math.min(60,it.s*1.18);draw()});B("↔️",()=>{it.flip*=-1;draw()});
 const l=document.createElement("span");l.className="lbl";l.textContent="Paint:";b.appendChild(l);
 HUES.forEach(h=>{const s=document.createElement("button");s.className="sw";s.style.background=h[1];s.onclick=()=>{it.f=h[0];draw();say("Painted!")};b.appendChild(s)});
 B("🗑️",()=>{items=items.filter(i=>i!==it);sel=null;draw();say("Bye bye "+it.n)})}
function drag(ev,it){ev.preventDefault();sel=it.id;const r=room.getBoundingClientRect();const mv=e=>{it.x=Math.min(98,Math.max(2,(e.clientX-r.left)/r.width*100));it.y=Math.min(99,Math.max(20,(e.clientY-r.top)/r.height*100));const el=[...box.children][items.indexOf(it)];if(el){el.style.left=it.x+"%";el.style.top=it.y+"%";if(!it.e.startsWith("rug:"))el.style.zIndex=Math.round(it.y*10)+10}};
 const up=()=>{removeEventListener("pointermove",mv);removeEventListener("pointerup",up);draw()};addEventListener("pointermove",mv);addEventListener("pointerup",up);draw()}
room.addEventListener("pointerdown",e=>{if(e.target===room||!e.target.closest(".it")){sel=null;draw()}});
tabs();pal();draw();
</script></body></html>
